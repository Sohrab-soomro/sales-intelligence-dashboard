<!DOCTYPE html>
<!--
  =============================================================================
  Sales Intelligence Control Center — North Region (Bundle Upsell Sciences)
  Author: Sohrab Soomro (https://github.com/Sohrab-soomro)
  
  IMPORTANT DATA DISCLAIMER (100% SYNTHETIC DUMMY DATA):
  The Excel workbooks (.xlsx) shipped alongside this dashboard in this repository
  contain 100% synthetic, computer-generated dummy data created strictly for
  portfolio demonstration and testing purposes. No actual telecom metrics,
  financial figures, franchise codes, or employee names are included.
  
  ARCHITECTURE OVERVIEW:
  - Self-contained, client-side analytics application (HTML5, CSS3, Vanilla JS).
  - Parses multi-sheet workbooks in-browser via SheetJS (xlsx.full.min.js).
  - Visualizes multi-period KPI trends and comparisons via Chart.js.
  =============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz Sales Intelligence Control Center — North Region</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
    --bg: #F3F4F7;
    --surface: #FFFFFF;
    --surface-2: #FAFAFC;
    --border: #E2E4EA;
    --ink: #14171C;
    --ink-soft: #565C68;
    --ink-faint: #8B909B;
    --red: #D6112C;
    --red-dark: #A80D22;
    --red-tint: #FCEAEC;
    --navy: #1F3A5F;
    --navy-tint: #EAEFF5;
    --green: #1F8A55;
    --green-tint: #E7F5EE;
    --amber: #B4700A;
    --amber-tint: #FBF0DE;
    --rail-w: 220px;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
}
button { font-family: inherit; }
::selection { background: var(--red-tint); color: var(--red-dark); }

.app { display: flex; min-height: 100vh; }
.rail {
    width: var(--rail-w);
    flex-shrink: 0;
    background: var(--ink);
    color: #fff;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
}
.rail-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 18px 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.brand-logo { flex-shrink: 0; height: 32px; width: auto; display: flex; align-items: center; }
.brand-logo svg { height: 32px; width: auto; }
.brand-text { line-height: 1.15; }
.brand-text .t1 { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.2px; color: #fff; }
.brand-text .t2 { font-size: 9.5px; color: rgba(255,255,255,0.5); letter-spacing: 0.4px; text-transform: uppercase; margin-top: 2px; }
.rail-nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.rail-btn {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px;
    border: none; background: transparent; color: rgba(255,255,255,0.68);
    border-radius: 8px; cursor: pointer; text-align: left; font-size: 13.3px; font-weight: 500;
    transition: background .12s, color .12s;
}
.rail-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
.rail-btn.active { background: var(--red); color: #fff; }
.rail-btn .ic { width: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.rail-btn .badge { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; background: rgba(255,255,255,0.12); padding: 1px 6px; border-radius: 20px; }
.rail-btn.active .badge { background: rgba(255,255,255,0.25); }
.rail-foot { padding: 14px 18px 18px 18px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 10px; color: rgba(255,255,255,0.38); line-height: 1.5; }
.rail-foot .reload-btn {
    display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 10px; margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.14); background: transparent; color: rgba(255,255,255,0.75);
    border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
}
.rail-foot .reload-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.cache-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 10px; margin-top: 4px; border: 1px solid rgba(255,255,255,0.06); }
.cache-badge .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
.cache-badge .dot.active { background: #4CAF50; }
.cache-badge .dot.inactive { background: #888; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 10px 28px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.page-heading { margin-right: auto; }
.page-heading h1 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.1px; }
.page-heading .subhead { margin: 1px 0 0 0; font-size: 11.5px; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.page-heading .subhead .period { font-weight: 700; color: var(--ink); background: var(--surface-2); padding: 0 8px; border-radius: 4px; border: 1px solid var(--border); font-size: 10.5px; font-family: var(--font-mono); }

.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-field { display: flex; flex-direction: column; gap: 2px; }
.filter-field label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-faint); font-weight: 700; padding-left: 2px; }
.filter-field select {
    appearance: none;
    background: var(--surface-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0L5 6L10 0" fill="none" stroke="%23565C68" stroke-width="1.4"/></svg>') no-repeat right 10px center;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 28px 7px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    min-width: 130px;
    cursor: pointer;
    background-color: var(--surface);
    transition: border-color .15s, box-shadow .15s;
}
.filter-field select:focus { outline: 2px solid var(--red); outline-offset: 1px; border-color: var(--red); }
.filter-field select option { font-weight: 500; }
.reset-btn {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 7px; padding: 8px 12px; font-size: 12px; font-weight: 600;
    color: var(--ink-soft); cursor: pointer; margin-left: 2px;
    transition: background .12s;
}
.reset-btn:hover { background: var(--surface-2); color: var(--ink); }
.filter-val-display {
    display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--ink);
    background: var(--surface-2); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
    font-family: var(--font-mono); letter-spacing: 0.2px;
}
.filter-val-display .label { font-weight: 400; font-size: 10px; text-transform: uppercase; color: var(--ink-faint); font-family: var(--font-body); letter-spacing: 0.4px; }

.crumb { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); padding: 10px 28px 0 28px; }
.crumb b { color: var(--ink); font-weight: 600; }
.crumb .sep { margin: 0 6px; color: var(--border); }
.content { padding: 14px 28px 60px 28px; }
.view { display: none; }
.view.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

.section-label { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--ink); margin: 26px 0 12px 0; }
.section-label:first-child { margin-top: 6px; }
.section-label .sig { display: flex; gap: 2px; align-items: flex-end; }
.section-label .sig i { width: 3px; background: var(--red); border-radius: 1px; display: block; }
.section-label .sig i:nth-child(1) { height:5px; }
.section-label .sig i:nth-child(2) { height:9px; }
.section-label .sig i:nth-child(3) { height:13px; }
.section-label .sub { font-weight: 400; color: var(--ink-faint); font-size: 11.5px; margin-left: 2px; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; position: relative; overflow: hidden; }
.kpi-card .lbl { font-size: 11px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
.kpi-card .val { font-family: var(--font-mono); font-size: 24px; font-weight: 600; margin-top: 6px; letter-spacing: -0.3px; }
.kpi-card .sub { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
.kpi-card .sub.up { color: var(--green); }
.kpi-card .sub.down { color: var(--red); }
.kpi-card.accent { border-color: var(--red); }
.kpi-card.accent::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--red); }
.kpi-card.flag { background: var(--red-tint); border-color: #F3C3CA; }
.kpi-card.flag .val, .kpi-card.flag .lbl { color: var(--red-dark); }

.grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-top: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-top: 12px; }
@media(max-width:1100px){ .grid-2, .grid-3 { grid-template-columns:1fr; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.card h3 { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; margin: 0 0 3px 0; }
.card .card-note { font-size: 11px; color: var(--ink-faint); margin-bottom: 12px; }
.chart-wrap { position: relative; height: 260px; }
.chart-wrap.tall { height: 340px; }

.health-comp-controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 14px;
}
.health-comp-controls .field { display: flex; flex-direction: column; gap: 2px; }
.health-comp-controls .field label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: var(--ink-faint); }
.health-comp-controls select {
    appearance: none;
    background: var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0L5 6L10 0" fill="none" stroke="%23565C68" stroke-width="1.4"/></svg>') no-repeat right 10px center;
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 28px 6px 10px;
    font-size: 12.5px; font-weight: 600; color: var(--ink); min-width: 140px; cursor: pointer;
}
.health-comp-controls select:focus { outline: 2px solid var(--red); outline-offset: 1px; }
.health-comp-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
.health-comp-title .sub { font-weight: 400; font-size: 12px; color: var(--ink-faint); font-family: var(--font-body); }
.health-comp-row {
    display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border);
}
.health-comp-row:last-child { border-bottom: none; }
.health-comp-name { width: 120px; flex-shrink: 0; font-size: 12px; font-weight: 600; font-family: var(--font-mono); }
.health-comp-bar-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.health-comp-bar { height: 14px; background: var(--red-tint); border-radius: 3px; overflow: hidden; display: flex; }
.health-comp-bar .fill-active { background: var(--navy); height: 100%; transition: width .3s; }
.health-comp-bar .fill-inactive { background: var(--red); height: 100%; opacity: 0.55; transition: width .3s; }
.health-comp-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint); font-family: var(--font-mono); }
.health-comp-val { width: 90px; text-align: right; flex-shrink: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink-soft); }

table.data-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data-tbl th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink-faint); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
table.data-tbl th:hover { color: var(--ink); }
table.data-tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data-tbl tbody tr:hover { background: var(--surface-2); }
table.data-tbl td.num, table.data-tbl th.num { font-family: var(--font-mono); text-align: right; }
.tbl-scroll { max-height: 420px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
.tbl-scroll table { border: none; }
.tbl-scroll thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 10.8px; font-weight: 700; letter-spacing: 0.2px; }
.pill::before { content:""; width:6px; height:6px; border-radius:50%; }
.pill.high { background: var(--red-tint); color: var(--red-dark); }
.pill.high::before { background: var(--red); }
.pill.watch { background: var(--amber-tint); color: var(--amber); }
.pill.watch::before { background: var(--amber); }
.pill.strong { background: var(--green-tint); color: var(--green); }
.pill.strong::before { background: var(--green); }
.pill.normal { background: var(--navy-tint); color: var(--navy); }
.pill.normal::before { background: var(--navy); }
.pill.nodata { background: #EEE; color: var(--ink-faint); }
.pill.nodata::before { background: var(--ink-faint); }

.insight-list { display: flex; flex-direction: column; gap: 8px; }
.insight-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border); font-size: 12.5px; line-height: 1.5; }
.insight-item .dot { width:6px; height:6px; border-radius:50%; background:var(--red); margin-top:6px; flex-shrink:0; }

.attn-item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; border-radius: 9px; margin-bottom: 8px; border: 1px solid transparent; }
.attn-item.high { background: var(--red-tint); border-color: #F3C3CA; }
.attn-item.watch { background: var(--amber-tint); border-color: #EFD9A6; }
.attn-item.strong { background: var(--green-tint); border-color: #B9E3CC; }
.attn-icon { width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; color:#fff; font-weight:700; }
.attn-item.high .attn-icon { background: var(--red); }
.attn-item.watch .attn-icon { background: var(--amber); }
.attn-item.strong .attn-icon { background: var(--green); }
.attn-body b { font-size:12.5px; }
.attn-body p { margin:2px 0 0 0; font-size:12px; color:var(--ink-soft); line-height:1.45; }

.op-controls {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 14px;
}
.op-slider-block { flex: 1; min-width: 260px; }
.op-slider-block .row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
.op-slider-block input[type=range] { width: 100%; accent-color: var(--red); }
.op-toggle { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.op-toggle button { border: none; background: transparent; padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
.op-toggle button.active { background: var(--ink); color: #fff; }
.op-count { display: flex; gap: 14px; }
.op-count .oc { text-align: center; }
.op-count .oc .n { font-family: var(--font-mono); font-size: 18px; font-weight: 700; }
.op-count .oc .l { font-size: 9.5px; text-transform: uppercase; color: var(--ink-faint); letter-spacing: 0.3px; }
.op-count .oc.high .n { color: var(--red); }
.op-count .oc.watch .n { color: var(--amber); }
.op-count .oc.strong .n { color: var(--green); }

.bundle-rank { display: flex; flex-direction: column; gap: 9px; }
.bundle-row { display: flex; align-items: center; gap: 10px; }
.bundle-rk { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); width: 16px; flex-shrink: 0; }
.bundle-name { width: 190px; flex-shrink: 0; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bundle-bar-track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bundle-bar-fill { height: 100%; background: var(--navy); border-radius: 3px; }
.bundle-val { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); width: 64px; text-align: right; flex-shrink: 0; }

.daily-comp-controls {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 18px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 14px;
}
.daily-comp-controls .field { display: flex; flex-direction: column; gap: 2px; }
.daily-comp-controls .field label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: var(--ink-faint); }
.daily-comp-controls select {
    appearance: none;
    background: var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0L5 6L10 0" fill="none" stroke="%23565C68" stroke-width="1.4"/></svg>') no-repeat right 10px center;
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 28px 6px 10px;
    font-size: 12.5px; font-weight: 600; color: var(--ink); min-width: 110px; cursor: pointer;
    background-color: var(--surface);
}
.daily-comp-controls select:focus { outline: 2px solid var(--red); outline-offset: 1px; }
.daily-comp-validation { font-size: 12px; font-weight: 600; color: var(--red-dark); padding: 6px 12px; background: var(--red-tint); border-radius: 6px; border: 1px solid #F3C3CA; }

.perf-insight {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-top: 12px;
}
.perf-insight h4 { font-family: var(--font-display); font-size: 13px; font-weight: 600; margin: 0 0 6px 0; display: flex; align-items: center; gap: 8px; }
.perf-insight h4 .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 10px; border-radius: 20px; }
.perf-insight h4 .badge.high { background: var(--green-tint); color: var(--green); }
.perf-insight h4 .badge.low { background: var(--red-tint); color: var(--red-dark); }
.perf-insight .body { font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
.perf-insight .body strong { color: var(--ink); }
.perf-insight .body .highlight { font-family: var(--font-mono); font-weight: 600; color: var(--red-dark); background: var(--red-tint); padding: 0 6px; border-radius: 3px; }

/* ===== PERFORMANCE INSIGHT STRIP (compact) ===== */
.perf-insight-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.perf-insight-strip .psi { display: flex; flex-direction: column; gap: 3px; flex: 1 1 200px; min-width: 190px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.perf-insight-strip .psi .psi-k { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: var(--ink-faint); }
.perf-insight-strip .psi .psi-v { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--ink); }
.perf-insight-strip .psi .psi-v small { font-size: 11px; font-weight: 600; color: var(--ink-soft); }
.perf-insight-strip .psi.lead { border-color: var(--green); background: var(--green-tint); }
.perf-insight-strip .psi.lead .psi-k, .perf-insight-strip .psi.lead .psi-v { color: #155E3A; }
.perf-insight-strip .psi.lag { border-color: var(--red); background: var(--red-tint); }
.perf-insight-strip .psi.lag .psi-k, .perf-insight-strip .psi.lag .psi-v { color: var(--red-dark); }
.perf-insight-strip .psi.na { opacity: 0.7; }

/* ===== INTELLIGENCE COCKPIT ===== */
.intel-filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; }
.intel-filters .field { display: flex; flex-direction: column; gap: 2px; }

<script>
(function(){
"use strict";

// LocalStorage cache keys and schema version so parsed workbooks persist across
// page reloads without needing to re-upload the Excel files every session.
const CACHE_KEY = 'jazz_dashboard_data_v3';
const CACHE_META_KEY = 'jazz_dashboard_meta_v3';
/* Bump this whenever the object consumed by App.boot changes.  Version 3 cache
   entries pre-date the defensive intelligence contract below. */
const SCHEMA_VERSION = '4.0';

function isLaunchableData(data) {
    return !!(data && Array.isArray(data.sources) && data.sources.length &&
        Array.isArray(data.mbus) && Array.isArray(data.fids) &&
        Array.isArray(data.rawData) && data.dateRange &&
        data.dateRange.min && data.dateRange.max && data.intel &&
        typeof data.intel === 'object');
}
function getCache() {
    try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!isLaunchableData(data)) return null;
        if (!data.meta || data.meta.schemaVersion !== SCHEMA_VERSION) return null;
        return data;
    } catch (_) { return null; }
}
function setCache(data) {
    try {
        const payload = {
            ...data,
            meta: {
                reportingPeriod: data.reportingPeriod || null,
                generatedAt: Date.now(),
                schemaVersion: SCHEMA_VERSION,
                dataVersion: (data.reportingPeriod || '') + '-' + (data.fileName || '') + '-' + Date.now()
            }
        };
        localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
        localStorage.setItem(CACHE_META_KEY, JSON.stringify({
            timestamp: Date.now(),
            fileName: data.fileName || 'unknown',
            reportingPeriod: data.reportingPeriod || null,
            schemaVersion: SCHEMA_VERSION,
            sourceCount: (data.sources || []).length,
            rowCount: data.rawRowCount || 0,
            mbus: data.mbus ? data.mbus.length : 0,

// Cross-sheet model builder: reconciles MBU Summary, FID Summary, FID ownership,
// Recharge Share, EVC BU Report, Locations, and daily RAW transactions while logging Data Quality checks.
function buildDataset(sheets) {
    const dq = [];
    const mbus = parseMbuSummary(sheets.mbuSummary);
    const fids = parseFidSummary(sheets.fidSummary);
    const fidById = new Map(fids.map(f => [f.fid, f]));

    const rawMbuRowCount = sheets.mbuSummary.slice(LAYOUT.mbuSummary.dataFrom).filter(r => r && r[0] != null).length;
    const subtotalRowsSkipped = rawMbuRowCount - mbus.length;
    dq.push({ level:'ok', text:`MBU Summary sheet: ${mbus.length} real MBUs loaded. ${subtotalRowsSkipped} sub-region/grand-total subtotal row(s) ("North 1", "North 2", "North 3", "North") were correctly excluded from the model — including them would have double- or triple-counted every regional total.` });

    const fidSheetRows = parseFidSheet(sheets.fidSheet);
    let fidSheetMisses = 0;
    fidSheetRows.forEach(r => {
        const target = fidById.get(r.fid);
        if(target) { target.tss = r.tss; target.zeroBundleRet = r.zeroBundleRet; target.vsLM = r.vsLM; target.bundleRechargeGrowth = r.bundleRechargeGrowth; }
        else fidSheetMisses++;
    });
    const fidSheetGap = fids.length - fidSheetRows.length;
    if(fidSheetGap !== 0) {
        dq.push({ level:'warn', text:`'FID' sheet has ${fidSheetRows.length} rows vs ${fids.length} in FID Summary — ${fidSheetGap} FID(s) present in FID Summary have no TSS/owner record. These are typically the zero-retailer FIDs (excluded from franchise ops tracking).` });
    }

    const evcRows = parseEvcBuReport(sheets.evcBuReport);
    evcRows.forEach(r => {
        const target = fidById.get(r.fid);
        if(target) { target.msisdnCount = r.msisdnCount; target.buPenetrationEvc = r.buPenetrationEvc; }
    });
    const evcGap = fids.length - evcRows.length;
    if(evcGap !== 0) {
        dq.push({ level:'warn', text:`'EVC BU Report' has ${evcRows.length} rows vs ${fids.length} FIDs in FID Summary — ${evcGap} FID(s) have no EVC penetration figure available.` });
    }

    const locRows = parseRechYtdGrowthLocations(sheets.rechYtdGrowth);
    locRows.forEach(r => {
        const target = fidById.get(r.fid);
        if(target) target.location = r.location;
    });

    const mixRows = parseRechargeShare(sheets.rechargeShare);
    const mbuById = new Map(mbus.map(m => [m.mbu, m]));
    let mixMatched = 0, mixSubtotalRows = 0, mixOutOfScope = [];
    mixRows.forEach(r => {
        const target = mbuById.get(r.mbu);
        if(target) { target.apcShare = r.apcShare; target.otarShare = r.otarShare; target.mwShare = r.mwShare; target.scShare = r.scShare; mixMatched++; }
        else if(/^North(\s\d)?$/.test(r.mbu||'')) mixSubtotalRows++;
        else mixOutOfScope.push(r.mbu);
    });
    dq.push({ level: mixMatched===mbus.length ? 'ok':'warn', text:`Recharge-mix composition matched for ${mixMatched} of ${mbus.length} MBUs.` });
    if(mixOutOfScope.length) {
        dq.push({ level:'warn', text:`'Recharge Share' sheet also lists ${mixOutOfScope.length} MBU(s) that don't appear in MBU Summary or FID Summary — namely the "North 4" sub-region (${mixOutOfScope.slice(0,3).join(', ')}${mixOutOfScope.length>3?', …':''}). This workbook's authoritative summaries are scoped to North 1–3 only; North 4 data exists in this one sheet but isn't reflected in the rest of the file, so it's excluded from this dashboard rather than guessed at.` });
    }

    const dupFids = fids.length - new Set(fids.map(f => f.fid)).size;
    dq.push({ level: dupFids===0?'ok':'warn', text: dupFids===0 ? `No duplicate FID records — ${fids.length} unique FIDs.` : `${dupFids} duplicate FID record(s) found in FID Summary.` });
    const dupMbus = mbus.length - new Set(mbus.map(m => m.mbu)).size;
    dq.push({ level: dupMbus===0?'ok':'warn', text: dupMbus===0 ? `No duplicate MBU records — ${mbus.length} unique MBUs.` : `${dupMbus} duplicate MBU record(s) found in MBU Summary.` });
    const missingMbuOnFid = fids.filter(f => !f.mbu).length;
    const missingSubOnFid = fids.filter(f => !f.subRegion).length;
    dq.push({ level: (missingMbuOnFid+missingSubOnFid)===0?'ok':'warn', text:`Missing MBU: ${missingMbuOnFid} · Missing Sub-region: ${missingSubOnFid} (on FID Summary rows).` });
    const zeroEvcFids = fids.filter(f => f.evc === 0);
    dq.push({ level: zeroEvcFids.length===0?'ok':'warn', text: zeroEvcFids.length===0 ? 'No FIDs with a zero EVC retailer base.' : `${zeroEvcFids.length} FID(s) have a zero EVC retailer base — Active %/Inactive % shown as no-data for these rather than a misleading 0%.` });
    const zeroCommission = mbus.filter(m => m.commission === 0).length;
    dq.push({ level: zeroCommission===mbus.length ? 'warn':'ok', text: zeroCommission===mbus.length ? `Commission is ₨0 for all ${mbus.length} MBUs — this is a genuine gap in the source feed, not a parsing error.` : `${zeroCommission} of ${mbus.length} MBUs show ₨0 commission.` });

    const raw = parseRaw(sheets.raw);
    const dailyMap = new Map(), dailySrMap = new Map(), dailyMbuMap = new Map(), dailyFidMap = new Map(), bundleMap = new Map();
    let minDate=null, maxDate=null;
    for(const r of raw) {
        if(!minDate || r.date<minDate) minDate = r.date;
        if(!maxDate || r.date>maxDate) maxDate = r.date;
        bump(dailyMap, r.date, r);
        bump(dailySrMap, r.date+'|'+r.subRegion, r);
        bump(dailyMbuMap, r.date+'|'+r.mbu, r);
        bump(dailyFidMap, r.date+'|'+r.fid, r);
        if(r.bundle) bumpBundle(bundleMap, r.bundle, r);
    }
    function bump(map,key,r) {
        const v = map.get(key) || { events:0, commission:0, recharge:0 };
        v.events += r.events; v.commission += r.commission; v.recharge += r.recharge;
        map.set(key,v);
    }
    function bumpBundle(map,key,r) {
        const v = map.get(key) || { bundle:key, events:0, commission:0, recharge:0 };
        v.events += r.events; v.commission += r.commission; v.recharge += r.recharge;
        map.set(key,v);
    }
    const trend = [...dailyMap.entries()].map(([date,v]) => ({ date, ...v })).sort((a,b) => a.date<b.date ? -1 : 1);
    const trendBySubRegion = [...dailySrMap.entries()].map(([k,v]) => { const [date,subRegion] = k.split('|'); return { date, subRegion, ...v }; }).sort((a,b) => a.date<b.date ? -1 : 1);
    const trendByMbu = [...dailyMbuMap.entries()].map(([k,v]) => { const [date,mbu] = k.split('|'); return { date, mbu, ...v }; }).sort((a,b) => a.date<b.date ? -1 : 1);
    const trendByFid = [...dailyFidMap.entries()].map(([k,v]) => { const [date,fid] = k.split('|'); return { date, fid, ...v }; }).sort((a,b) => a.date<b.date ? -1 : 1);
    const topBundlesEvents = [...bundleMap.values()].sort((a,b) => b.events - a.events).slice(0,12);
    const topBundlesRecharge = [...bundleMap.values()].sort((a,b) => b.recharge - a.recharge).slice(0,12);

    const fidCountFromRaw = new Set(raw.map(r => r.fid)).size;
    dq.push({ level: fidCountFromRaw<=fids.length ? 'ok':'warn', text:`Raw transaction data covers ${fidCountFromRaw} distinct FIDs across ${minDate} to ${maxDate} (${trend.length} days) — reconciles against ${fids.length} FIDs in FID Summary.` });

    return { mbus, fids, trend, trendBySubRegion, trendByMbu, trendByFid, topBundlesEvents, topBundlesRecharge, dq, dateRange:{min:minDate, max:maxDate}, rawRowCount:raw.length, rawData: raw };
}

function iFmtInt(v){
    if(v===null||v===undefined) return '—';
    const a = Math.abs(v);
    if(a>=1e9) return (v/1e9).toFixed(1)+'B';
    if(a>=1e6) return (v/1e6).toFixed(1)+'M';
    if(a>=1e3) return (v/1e3).toFixed(1)+'K';
    return Math.round(v).toLocaleString('en-US');
}

function iFmtMoney(v){
  if(v===null||v===undefined) return '—';
  const a=Math.abs(v);
  if(a>=1e9) return '₨'+(v/1e9).toFixed(2)+'B';
  if(a>=1e6) return '₨'+(v/1e6).toFixed(1)+'M';
  if(a>=1e3) return '₨'+(v/1e3).toFixed(1)+'K';
  return '₨'+Math.round(v).toLocaleString('en-US');
}
function classifyValidity(bundle){
    if(!bundle) return null;
    const b = String(bundle).toLowerCase();
    for(const r of VALIDITY_RULES) if(r.kws.some(k => b.includes(k))) return r.label;
    return null;

/* Bundle type is derived only from the Product Commercial Name / bundle name
   present in RAW. It is a display and filter grouping; no score is altered. */
function classifyBundleType(bundle){
    const b = String(bundle || '').toLowerCase();
    const period = b.includes('daily') ? 'Daily' : b.includes('weekly') ? 'Weekly' :
        b.includes('monthly') ? 'Monthly' : b.includes('90 day') || b.includes('90day') ? '90 Days' :
        b.includes('100 day') || b.includes('100day') ? '100 Days' : '';
    const service = b.includes('social') || b.includes('facebook') || b.includes('youtube') || b.includes('tiktok') || b.includes('whatsapp') ? 'Social' :
        b.includes('call') || b.includes('voice') || b.includes('onnet') || b.includes('minutes') ? 'Call / Voice' :
        b.includes('sms') ? 'SMS' :
        b.includes('data') || b.includes('internet') || b.includes('super') ? 'Data' :
        b.includes('sharing') || b.includes('share') ? 'Sharing' :
        b.includes('saudi') ? 'Saudi' : b.includes('world') ? 'World' :
        b.includes('insurance') ? 'Insurance' : '';
    return period && service ? period + ' ' + service : period || service || 'Other';
}
function bundleStatsFromRaw(raw){
    const map = new Map();
    (raw||[]).forEach(r => {
        if(!r.bundle) return;
        const key = r.bundle;
        const o = map.get(key) || { bundle:key, events:0, recharge:0, commission:0, fidSet:new Set() };
        o.events += r.events||0; o.recharge += r.recharge||0; o.commission += r.commission||0;
        if(r.fid) o.fidSet.add(r.fid);
        map.set(key, o);
    });
    return [...map.values()].map(o => ({ bundle:o.bundle, events:o.events, recharge:o.recharge, commission:o.commission, fidCount:o.fidSet.size }));
}
function bundleStatsBySubRegion(raw){
    const map = new Map();
    (raw||[]).forEach(r => {
        if(!r.bundle || !r.subRegion) return;
        const key = r.subRegion + '||' + r.bundle;
        const o = map.get(key) || { subRegion:r.subRegion, bundle:r.bundle, events:0, recharge:0 };
        o.events += r.events||0; o.recharge += r.recharge||0;
        map.set(key, o);
    });

}
function pctGrowth(cur, prev){
    if(prev === null || prev === undefined || prev === 0) return null;
    return (cur - prev) / prev;
}
function classifyMomentum(cur, prev, growth){
    if(growth === null){
        if(cur > 0 && prev === 0) return 'EMERGING';
        if(cur === 0 && prev > 0) return 'DORMANT';
        return 'STABLE';
    }
    if(growth >= 0.15) return 'RISING';
    if(growth <= -0.10) return 'DECLINING';
    return 'STABLE';
}

// Multi-period Intelligence Engine:
// Computes weighted 3-month historical baselines (50/30/20), linear trend slopes,
// transition consistency, Bundle Priority Scores (0-100), and Next Best Actions (NBA).
function buildIntelligence(current, historical){
    const out = { hasHistory: historical.length > 0, monthCount: historical.length + 1 };
    const curRaw = (current && current.rawData) || [];

    // ── Helper: valid reporting days from unique dates ──────────────────────
    function periodDays(dataset) {
        if(!dataset || !dataset.rawData || !dataset.rawData.length) return 1;
        const dates = new Set(dataset.rawData.map(r => r.date).filter(Boolean));
        return Math.max(dates.size, 1);
    }

    // ── Historical weights: 50/30/20 (normalised when < 3 available) ────────
    function getWeights(n) {
        const W = [0.5, 0.3, 0.2];
        const slice = W.slice(0, Math.min(n, 3));
        const total = slice.reduce((a,b)=>a+b,0);
        return slice.map(w=>w/total);
    }

    // ── Bundle stats aggregation from raw rows ───────────────────────────────
    function bundleStatsPerPeriod(dataset) {
        const days = periodDays(dataset);
        const raw  = (dataset && dataset.rawData) || [];
        const map  = new Map();
        raw.forEach(r => {
            if(!r.bundle) return;
            const o = map.get(r.bundle) || { bundle:r.bundle, events:0, recharge:0, commission:0, fidSet:new Set() };
            o.events     += r.events     || 0;
            o.recharge   += r.recharge   || 0;
            o.commission += r.commission || 0;
            if(r.fid) o.fidSet.add(r.fid);
            map.set(r.bundle, o);
        });
        return [...map.values()].map(o=>({
            bundle:      o.bundle,
            events:      o.events,
            recharge:    o.recharge,
            commission:  o.commission,
            fidCount:    o.fidSet.size,
            eventsPerDay: o.events / days,
            days:        days
        }));
    }

    // ── Validate RAW dates & detect issues ───────────────────────────────────
    const dqWarnings = [];
    const allPeriods = [...historical, current].filter(Boolean);
    allPeriods.forEach((ds,i) => {
        if(!ds.rawData || ds.rawData.length === 0) dqWarnings.push({ code:'EMPTY_RAW', level:'error', msg:`Period ${i+1} ("${ds.fileName||'?'}") has an empty RAW sheet.` });
        if(!ds.dateRange || !ds.dateRange.min) dqWarnings.push({ code:'INVALID_DATES', level:'error', msg:`Period ${i+1} has no valid dates.` });
    });
    // ── Per-period bundle stats ──────────────────────────────────────────────
    const curStats  = bundleStatsPerPeriod(current);
    // Reverse so histStats[0]=most recent historical, matching 50/30/20 weight order
    const histStats = historical.slice().reverse().slice(0,3).map(h => bundleStatsPerPeriod(h));
    const curDays   = periodDays(current);

    // ── Totals ───────────────────────────────────────────────────────────────
    const totalCurEvents   = curStats.reduce((a,b)=>a+b.events, 0);
    const totalCurRecharge = curStats.reduce((a,b)=>a+b.recharge, 0);
    const commissionZero   = curStats.every(b=>b.commission===0);
    if(commissionZero) dqWarnings.push({ code:'COMMISSION_ZERO', level:'warn', msg:'Commission is zero for all current-period bundles — excluded from commercial scoring per spec §10.' });

    // ── DATA-DRIVEN ACTIVITY FLOOR (spec §20) ────────────────────────────────
    // Use P10 of bundle event distribution across all four files
    const allEventVals = [];
    allPeriods.forEach(ds => {
        bundleStatsPerPeriod(ds).forEach(b=>{ if(b.events>0) allEventVals.push(b.events); });
    });
    allEventVals.sort((a,b)=>a-b);
    const p10idx  = Math.max(0, Math.floor(allEventVals.length * 0.10) - 1);
    const activityFloor = Math.max(5, allEventVals[p10idx] || 5);
    out.activityFloor = activityFloor;
    out.activityFloorMethod = `P10 of all-period bundle event distribution (${allEventVals.length} data points). Min safeguard: 5.`;

    // ── All bundle names (current union historical) ──────────────────────────
    const allBundles = new Set(curStats.map(b=>b.bundle));
    histStats.forEach(hs => hs.forEach(b=>allBundles.add(b.bundle)));

    // ── Regional min-activity threshold for replication ─────────────────────
    const regActVals = [];
    curRaw.forEach(r => { if(r.events>0) regActVals.push(r.events); });
    regActVals.sort((a,b)=>a-b);
    out.regMinActivity = Math.max(10, regActVals[Math.floor(regActVals.length*0.10)] || 10);

    // ── Per-bundle multi-period computation ──────────────────────────────────
    const weights = getWeights(histStats.length);

    function weightedBaseline(bundleName) {
        // Newest historical first (histStats[0] = most recent historical)
        const recentHist = histStats.slice(0,3); // already newest-first from slice(-3).reverse() in caller
        let totalW=0, weightedRate=0, weightedRechRate=0, monthsUsed=0;
        recentHist.forEach((hs, i) => {
            const b = hs.find(x=>x.bundle===bundleName);
            if(b !== undefined) {                    // includes genuine zeros
                const w = weights[i] || 0;
                weightedRate     += (b ? b.eventsPerDay : 0) * w;
                weightedRechRate += (b ? b.recharge / Math.max(b.days,1) : 0) * w;
                totalW  += w;
                monthsUsed++;
            }
        });
        if(totalW === 0) return null;
        return { rate: weightedRate/totalW, rechRate: weightedRechRate/totalW, monthsUsed };
    }

    function trendSlope(bundleName) {
        const pts = allPeriods.map((ds,i)=>{
            const hs = i < allPeriods.length-1 ? histStats[i] : curStats;
            const b  = (i < allPeriods.length-1 ? histStats[i] : curStats).find(x=>x.bundle===bundleName);
            return { x:i, y: b ? b.eventsPerDay : 0 };
        });
        const n = pts.length;
        if(n<2) return 0;
        const xm = (n-1)/2, ym = pts.reduce((a,p)=>a+p.y,0)/n;
        let num=0, den=0;
        pts.forEach(p=>{ num+=(p.x-xm)*(p.y-ym); den+=(p.x-xm)**2; });
        return den===0 ? 0 : num/den;
    }

    function consistency(bundleName) {
        // Non-declining transitions / total valid transitions
        const allRates = allPeriods.map((ds,i)=>{
            const stats = i < allPeriods.length-1 ? histStats[i] : curStats;
            const b = stats.find(x=>x.bundle===bundleName);
            return b ? b.eventsPerDay : 0;
        });
        if(allRates.length<2) return { val:null, transitions:0 };
        let nonDecl=0, total=0;
        for(let i=1;i<allRates.length;i++){
            if(allRates[i]>0 || allRates[i-1]>0) { total++; if(allRates[i]>=allRates[i-1]) nonDecl++; }
        }
        return { val: total>0 ? nonDecl/total : null, transitions:total };
    }

    function volatility(bundleName) {
        const vals = histStats.map(hs=>{ const b=hs.find(x=>x.bundle===bundleName); return b?b.eventsPerDay:null; }).filter(v=>v!==null && v>0);
        if(vals.length<2) return 0;
        const m = vals.reduce((a,b)=>a+b,0)/vals.length;
        if(m===0) return 0;
        const variance = vals.reduce((a,v)=>a+(v-m)**2,0)/vals.length;
        return Math.sqrt(variance)/m;
    }

    function confidenceLevel(monthsUsed, vol) {
        if(monthsUsed===0) return 'Insufficient History';
        if(monthsUsed>=3 && vol<0.5)  return 'High';
        if(monthsUsed>=2)              return 'Medium';
        if(monthsUsed===1 && vol<0.8)  return 'Low';
        return 'Low';
    }

    // ── BUNDLE MOMENTUM ──────────────────────────────────────────────────────
    out.bundleMomentum = [];
    allBundles.forEach(bname => {
        const cb        = curStats.find(x=>x.bundle===bname) || { events:0, eventsPerDay:0, recharge:0, commission:0 };
        const curRate   = cb.eventsPerDay;
        const baseline  = weightedBaseline(bname);
        const slope     = trendSlope(bname);
        const cons      = consistency(bname);
        const vol       = volatility(bname);
        const monthsUsed= baseline ? baseline.monthsUsed : 0;
        const conf      = confidenceLevel(monthsUsed, vol);

        let lift=null, status='STABLE', momentumWarning=null;
        if(baseline) {
            const bRate = baseline.rate;
            if(bRate > 0) {
                lift = (curRate - bRate) / bRate;
            } else if(bRate === 0 && curRate > 0) {
                // Zero baseline — classify as EMERGING, no normal percentage
                status = 'EMERGING';
                momentumWarning = 'ZERO_BASELINE';
            } else if(bRate === 0 && curRate === 0) {
                lift = 0;
            }
        } else if(curRate > 0) {
            status = 'EMERGING';
            momentumWarning = 'NO_HISTORY';
        }

        // Dormant: no current activity, but was active historically
        if(curRate === 0) {
            const hadHistory = histStats.some(hs=>{ const b=hs.find(x=>x.bundle===bname); return b && b.eventsPerDay>0; });
            if(hadHistory) { status='DORMANT'; lift=null; }
        }

        // Apply classification only when lift is meaningful
        if(lift !== null && status !== 'DORMANT' && status !== 'EMERGING') {
            // RISING: all conditions (spec §19)
            if( lift >= 0.10 &&
                slope > 0 &&
                cons.val !== null && cons.val >= 0.50 &&
                cb.events >= activityFloor &&
                monthsUsed >= 1) {
                    status = 'RISING';
            } else if(lift <= -0.10 && slope < 0 && cb.events >= activityFloor) {
                status = 'DECLINING';
            } else {
                status = 'STABLE';
            }
            // Safeguard: one abnormal month cannot drive Rising/Declining
            if(monthsUsed === 1 && vol > 0.5 && (status==='RISING'||status==='DECLINING')) {
                status = 'STABLE';
                momentumWarning = 'HIGH_VOLATILITY_ONE_MONTH';
            }
        }

        // Missing validity warning
        const validity = classifyValidity(bname);
        if(!validity) dqWarnings.push({ code:'MISSING_VALIDITY', level:'info', msg:`Bundle "${bname}" could not be classified by validity.` });

        out.bundleMomentum.push({
            bundle:      bname,
            validity:    validity || 'Unknown',
            events:      cb.events,
            recharge:    cb.recharge,
            commission:  cb.commission,
            commissionAvailable: !commissionZero && cb.commission > 0,
            eventsPerDay:   curRate,
            baselineRate:   baseline ? baseline.rate : null,
            lift,
            slope,
            consistency:    cons.val,
            totalTransitions: cons.transitions,
            volatility:  vol,
            confidence:  conf,
            monthsUsed,
            status,
            momentumWarning,
            activationShare:   totalCurEvents>0 ? cb.events/totalCurEvents : null,
            rechargeShare:     totalCurRecharge>0 ? cb.recharge/totalCurRecharge : null,
            rechargePerEvent:  cb.events>0 ? cb.recharge/cb.events : null
        });
    });
    out.bundleMomentum.sort((a,b)=>b.events-a.events);
    out.dqWarnings = dqWarnings;

    // ── BUSINESS VERDICT (spec §21) ──────────────────────────────────────────
    out.bundleMomentum.forEach(m => {
        const highVal = m.rechargeShare !== null && m.rechargeShare >= 0.05;
        const strongMom = m.status==='RISING';
        if(strongMom && highVal)          m.verdict='High-Momentum / High-Value';
        else if(strongMom && !highVal)    m.verdict='High-Momentum / Low-Value';
        else if(m.status==='STABLE' && highVal) m.verdict='Stable / High-Value';
        else if(m.status==='DECLINING' && highVal) m.verdict='Declining / High-Value';
        else if(m.status==='EMERGING')    m.verdict='Emerging / Watch';
        else if(m.events < activityFloor) m.verdict='Low-Volume / Low-Confidence';
        else                              m.verdict='Stable / Standard';
    });

    // ── VALIDITY TREND (spec §30-33) ────────────────────────────────────────
    function validityAgg(stats, days) {
        const map = new Map();
        stats.forEach(b=>{
            const v = classifyValidity(b.bundle) || 'Unknown';
            const o = map.get(v) || { validity:v, events:0, recharge:0, bundleCount:0 };
            o.events += b.events; o.recharge += b.recharge; o.bundleCount++;
            map.set(v,o);
        });
        return [...map.values()].map(o=>({ ...o, eventsPerDay:o.events/Math.max(days,1) }));
    }

    const curValidity = validityAgg(curStats, curDays);
    const curValTotal = curValidity.reduce((a,v)=>a+v.events,0);

    out.validityTrend = curValidity.map(v=>{
        const curShare = curValTotal>0 ? v.events/curValTotal : null;
        // Historical baseline
        const WEIGHTS = getWeights(histStats.length);
        let totalW=0, wRate=0, wShare=0, monthsUsed=0;
        // histStats is newest-first after reversal; allPeriods is oldest-first, so reverse for indexing
        const histPeriodsNewestFirst = allPeriods.slice(0,-1).reverse();
        histStats.forEach((hs,i)=>{
            const hv = validityAgg(hs, histPeriodsNewestFirst[i] ? periodDays(histPeriodsNewestFirst[i]) : 30);
            const found = hv.find(x=>x.validity===v.validity);
            if(found) {
                const hvTotal = hv.reduce((a,x)=>a+x.events,0);
                const hShare = hvTotal>0 ? found.events/hvTotal : 0;
                wRate  += found.eventsPerDay * (WEIGHTS[i]||0);
                wShare += hShare * (WEIGHTS[i]||0);
                totalW += (WEIGHTS[i]||0);
                monthsUsed++;
            }
        });

        const baseRate  = totalW>0 ? wRate/totalW  : null;
        const baseShare = totalW>0 ? wShare/totalW : null;
        const rateLift  = baseRate!==null && baseRate>0 ? (v.eventsPerDay-baseRate)/baseRate : (baseRate===0&&v.eventsPerDay>0?Infinity:null);
        const shareChange = (curShare!==null && baseShare!==null) ? curShare-baseShare : null;
        const conf = confidenceLevel(monthsUsed, 0);
        // Direction: ±5% threshold (spec §32)
        let direction = 'Flat';
        if(rateLift!==null && rateLift!==Infinity && rateLift>0.05) direction='Growing';
        else if(rateLift!==null && rateLift<-0.05) direction='Declining';
        // Verdicts (spec §33)
        let businessVerdict='Insufficient History';
        if(rateLift!==null) {
            const highComm = v.recharge > 0 && (v.recharge/(totalCurRecharge||1)) > 0.05;
            if(direction==='Growing' && highComm) businessVerdict='Commercially Important Growth';
            else if(direction==='Growing' && curShare>0.1) businessVerdict='Mix Expansion';
            else if(direction==='Growing') businessVerdict='Structural Growth';
            else if(direction==='Declining' && highComm) businessVerdict='Structural Decline — High Commercial Risk';
            else if(direction==='Declining') businessVerdict='Structural Decline';
            else if(shareChange!==null && shareChange>0.02) businessVerdict='Volume Growth but Mix Gain';
            else if(shareChange!==null && shareChange<-0.02) businessVerdict='Volume Growth but Mix Loss';
            else businessVerdict='Flat — Stable';
        }
        return {
            validity:v.validity, events:v.events, eventsPerDay:v.eventsPerDay,
            recharge:v.recharge, eventShare:curShare, shareChange,
            rateLift, direction, confidence:conf, monthsUsed,
            bundleCount:v.bundleCount, businessVerdict
        };
    }).sort((a,b)=>b.events-a.events);

    // ── REGIONAL MOMENTUM ───────────────────────────────────────────────────
    function bundleStatsBySubRegion(raw) {
        const map = new Map();
        (raw||[]).forEach(r=>{
            if(!r.bundle||!r.subRegion) return;
            const key = r.subRegion+'||'+r.bundle;
            const o = map.get(key) || { subRegion:r.subRegion, bundle:r.bundle, events:0, recharge:0 };
            o.events += r.events||0; o.recharge += r.recharge||0;
            map.set(key,o);
        });
        return [...map.values()];
    }

    const curBySr  = bundleStatsBySubRegion(curRaw);
    const srNames  = [...new Set(curBySr.map(b=>b.subRegion))];
    out.regionMomentum = srNames.map(sr=>{
        const curSr = curBySr.filter(b=>b.subRegion===sr);
        const srTotal = curSr.reduce((a,b)=>a+b.events,0);
        const rows = curSr.map(b=>{
            // Historical for same sub-region — use most recent historical period
            let prevEvents = 0;
            if(historical.length>0) {
                const lastHist = historical[historical.length-1];
                const prevBySr = bundleStatsBySubRegion(lastHist.rawData||[]);
                const pb = prevBySr.find(x=>x.subRegion===sr&&x.bundle===b.bundle);
                prevEvents = pb?pb.events:0;
            }
            const growth = prevEvents>0 ? (b.events-prevEvents)/prevEvents : (b.events>0&&prevEvents===0?Infinity:null);
            return {
                bundle:b.bundle, events:b.events, prevEvents, recharge:b.recharge, growth,
                validity:classifyValidity(b.bundle)||'Unknown',
                activationShare: srTotal>0?b.events/srTotal:null,
                momentum: out.bundleMomentum.find(m=>m.bundle===b.bundle)
            };
        }).sort((a,b)=>b.events-a.events);
        return { subRegion:sr, bundles:rows, total:srTotal };
    }).filter(r=>r.total>0);

    // ── BUNDLE PRIORITY SCORE (spec §22-29) ─────────────────────────────────
    // Normalize commercial metrics rank-based
    const eligBundles = out.bundleMomentum.filter(m=>m.recharge>0);
    const rsSorted  = [...eligBundles].sort((a,b)=>a.rechargeShare-b.rechargeShare);
    const rpeSorted = [...eligBundles].sort((a,b)=>a.rechargePerEvent-b.rechargePerEvent);
    function rankNorm(sorted, bundle) {
        const idx = sorted.findIndex(x=>x.bundle===bundle.bundle);
        return idx<0||sorted.length<=1 ? 0 : idx/(sorted.length-1);
    }

    function bundlePriorityFor(filteredRaw) {
        const filteredStats = bundleStatsFromRaw(filteredRaw);
        const filtTotal = filteredStats.reduce((a,b)=>a+b.events,0);
        const statMap = new Map(filteredStats.map(b=>[b.bundle,b]));

        return out.bundleMomentum.map(m=>{
            const fs = statMap.get(m.bundle) || { events:0, recharge:0, commission:0 };
            const share = filtTotal>0 ? fs.events/filtTotal : null;
            const components = {};
            const reasons = [];
            let score=0;

            // 1. Momentum Strength (25)
            let momPts=0;
            if(m.status==='RISING'&&m.lift!==null) {
                const liftPts = Math.min(15, Math.round(m.lift*60));
                momPts = liftPts + (m.slope>0?5:0) + ((m.consistency||0)>=0.5?5:0);
                reasons.push(`Rising ${((m.lift||0)*100).toFixed(1)}% lift, slope ${m.slope>0?'↑':'→'}, consistency ${((m.consistency||0)*100).toFixed(0)}%.`);
            } else if(m.status==='EMERGING') {
                momPts=8; reasons.push('Newly emerging bundle.');
            } else if(m.status==='STABLE') {
                momPts=10; reasons.push('Stable activation pattern.');
            } else if(m.status==='DECLINING') {
                momPts=Math.max(0,5-Math.min(5,Math.round(Math.abs(m.lift||0)*20)));
                reasons.push(`Declining ${((m.lift||0)*100).toFixed(1)}%.`);
            }
            if(m.events < activityFloor) momPts=Math.min(momPts,6);
            components.momentum = Math.min(25, Math.round(momPts));
            score += components.momentum;

            // 2. Confidence + Consistency (15)
            let confPts = m.confidence==='High'?8 : m.confidence==='Medium'?5 : m.confidence==='Low'?2:0;
            const consPts = (m.consistency!==null) ? Math.round((m.consistency||0)*4) : 0;
            const volPts  = (m.volatility!==null) ? Math.max(0,3-Math.round(m.volatility*3)) : 2;
            components.confidence = Math.min(15, confPts+consPts+volPts);
            score += components.confidence;

            // 3. Commercial Value (20) — recharge only, no commission proxy (spec §10/25)
            let commPts=0;
            if(fs.recharge>0 || m.recharge>0) {
                const normRS  = rankNorm(rsSorted, m);
                const normRPE = rankNorm(rpeSorted, m);
                commPts = Math.round(normRS*10 + normRPE*10);
                reasons.push(`Recharge share ${((m.rechargeShare||0)*100).toFixed(1)}%, Recharge/Event ${(m.rechargePerEvent||0).toFixed(1)}.`);
            } else {
                reasons.push('Missing recharge data — commercial score 0 (spec §25).');
            }
            components.commercial = Math.min(20, commPts);
            score += components.commercial;

            // 4. Validity Trend (10)
            const vt = out.validityTrend.find(v=>v.validity===m.validity);
            let valPts=5;
            if(vt) {
                if(vt.direction==='Growing'&&vt.recharge>0) valPts=10;
                else if(vt.direction==='Growing') valPts=8;
                else if(vt.direction==='Flat'&&vt.eventShare>0.15) valPts=7;
                else if(vt.direction==='Declining') valPts=2;
            }
            components.validityGrowth = Math.min(10, valPts);
            score += components.validityGrowth;

            // 5. Activation Share Headroom (15) — NOT penetration (spec §27/55)
            let headroomPts=0;
            if(share!==null) {
                // Low share = headroom only if supported by momentum/commercial
                if(m.status==='RISING'&&share<0.05)    headroomPts=15;
                else if(m.status==='RISING'&&share<0.15) headroomPts=10;
                else if(share<0.05)                    headroomPts=8;
                else if(share<0.15)                    headroomPts=5;
                else if(share<0.30)                    headroomPts=3;
                else headroomPts=1;
                if(m.events<activityFloor) headroomPts=Math.min(headroomPts,4);
            }
            if(share!==null) reasons.push(`Activation Share (not penetration): ${((share||0)*100).toFixed(1)}%.`);
            components.headroom = Math.min(15, headroomPts);
            score += components.headroom;

            // 6. Regional Adoption Gap (15) — data-driven threshold (spec §28)
            let gapPts=0;
            const srData = out.regionMomentum.map(r=>{
                const rb  = r.bundles.find(x=>x.bundle===m.bundle);
                const rTot = r.total;
                return (rb && rTot > out.regMinActivity) ? { sr:r.subRegion, share:rb.events/rTot, events:rb.events } : null;
            }).filter(Boolean);
            if(srData.length>=2) {
                const maxSh = Math.max(...srData.map(x=>x.share));
                const minSh = Math.min(...srData.map(x=>x.share));
                const gap   = maxSh-minSh;
                if(gap>0.15 && m.status==='RISING')   gapPts=15;
                else if(gap>0.15)                      gapPts=10;
                else if(gap>0.08)                      gapPts=6;
                else gapPts=3;
                reasons.push(`Sub-region adoption gap: ${(gap*100).toFixed(1)}pp (min regional sample: ${out.regMinActivity|0} events).`);
            } else {
                gapPts=3; // insufficient regional data — not fabricated
                reasons.push('Insufficient regional comparison data for gap scoring.');
            }
            components.adoptionGap = Math.min(15, gapPts);
            score += components.adoptionGap;

            // ── SAFEGUARDS (spec §29) ────────────────────────────────────────
            if(m.events < activityFloor)                          score=Math.min(score,35);
            if(m.confidence==='Insufficient History')             score=Math.min(score,40);
            if(m.momentumWarning==='ZERO_BASELINE')               score=Math.min(score,50);
            if(m.status==='DORMANT')                              score=Math.min(score,20);
            if(m.volatility>1.0&&m.monthsUsed===1)               score=Math.min(score,45);
            if(!m.recharge&&!fs.recharge&&components.headroom>10) score=Math.min(score,45);

            const finalScore = Math.min(100, Math.max(0, Math.round(score)));

            // Score band (spec §58)
            let band;
            if(finalScore>=80)      band='High Priority';
            else if(finalScore>=65) band='Strong Priority';
            else if(finalScore>=50) band='Monitor / Selective Opportunity';
            else if(finalScore>=35) band='Normal / Lower Priority';
            else                    band='Low / Insufficient Evidence';

            return {
                bundle:m.bundle, validity:m.validity,
                events:fs.events||m.events, recharge:fs.recharge||m.recharge, commission:fs.commission||m.commission,
                share, score:finalScore, band,
                components, reasons,
                confidence:m.confidence,
                status:m.status, verdict:m.verdict,
                lift:m.lift, slope:m.slope, consistency:m.consistency,
                volatility:m.volatility, monthsUsed:m.monthsUsed,
                activationShare:m.activationShare, rechargeShare:m.rechargeShare, rechargePerEvent:m.rechargePerEvent
            };
        }).sort((a,b)=>b.score-a.score);
    }

    out.bundlePriority = bundlePriorityFor(curRaw);
    out.propensityNorth = out.bundlePriority; // backward compat

    // ── OPPORTUNITY FINDER (spec §34-41) ────────────────────────────────────
    const fids  = (current&&current.fids)  || [];
    const mbus  = (current&&current.mbus)  || [];

    // Peer inactive rate: use SUM(peer inactive)/SUM(peer EVC) — spec §35
    const srAgg = new Map();
    fids.forEach(f=>{
        const a = srAgg.get(f.subRegion) || { evc:0, inactive:0, active:0, recharge:0, events:0, count:0 };
        a.evc += f.evc||0; a.inactive += f.inactive||0; a.active += f.active||0;
        a.recharge += f.recharge||0; a.events += f.events||0; a.count++;
        srAgg.set(f.subRegion,a);
    });

    function opportunityScore(row, peers) {
        const inactiveRateThis = (row.evc||0)>0 ? (row.inactive||0)/(row.evc||0) : null;
        const peerEvc   = peers.reduce((a,p)=>a+(p.evc||0),0);
        const peerInact = peers.reduce((a,p)=>a+(p.inactive||0),0);
        const peerRate  = peerEvc>0 ? peerInact/peerEvc : null; // aggregated, NOT average of pcts
        const reasons   = [];
        let score=0;

        // 1. Inactive Rate Gap (30)
        if(inactiveRateThis!==null&&peerRate!==null&&peerRate>0) {
            const gap = inactiveRateThis/peerRate;
            if(gap>1.15)  { score+=30; reasons.push(`Inactive rate ${(inactiveRateThis*100).toFixed(1)}% vs peer aggregate ${(peerRate*100).toFixed(1)}% (gap: +${((inactiveRateThis-peerRate)*100).toFixed(1)}pp).`); }
            else if(gap>0.85) { score+=15; reasons.push(`Inactive rate near peer aggregate.`); }
            else              { score+=5;  reasons.push(`Below-average inactive rate.`); }
        } else if(inactiveRateThis!==null) {
            score+=12; reasons.push(`Inactive rate: ${(inactiveRateThis*100).toFixed(1)}% (no peer baseline).`);
        }

        // 2. Addressable Base (20)
        const inactive = row.inactive||0;
        const maxInact = Math.max(...[...fids.map(f=>f.inactive||0),1]);
        const baseScore = Math.round((inactive/maxInact)*20);
        score += baseScore;
        if(inactive>0) reasons.push(`${inactive.toLocaleString()} inactive retailers addressable.`);

        // 3. Commercial Base (20)
        const srTotal  = srAgg.get(row.subRegion) || { recharge:0 };
        const rRatio   = srTotal.recharge>0 ? (row.recharge||0)/srTotal.recharge : 0;
        const commScore= Math.round(Math.min(1, rRatio*10)*20);
        score += commScore;
        if(row.recharge>0) reasons.push(`Recharge contribution: ${iFmtMoney(row.recharge)}.`);

        // 4. Activation Intensity (15)
        const evPerEvc  = (row.evc||0)>0 ? (row.events||0)/(row.evc||0) : 0;
        const srEvPerEvc= (srAgg.get(row.subRegion)||{evc:0,events:0});
        const srRatio   = srEvPerEvc.evc>0 ? srEvPerEvc.events/srEvPerEvc.evc : 0;
        let intScore=8;
        if(srRatio>0 && evPerEvc < srRatio*0.8) { intScore=15; reasons.push('Activation intensity below sub-region — opportunity to close gap.'); }
        else if(srRatio>0 && evPerEvc > srRatio*1.2) { intScore=5; }
        score += intScore;

        // 5. Bundle Potential (15) — from bundlePriority
        const topBundle = out.bundlePriority.filter(b=>{
            // Check if this bundle is relevant to the entity's sub-region
            const rm = out.regionMomentum.find(r=>r.subRegion===row.subRegion);
            return rm && rm.bundles.some(rb=>rb.bundle===b.bundle&&rb.events>=out.regMinActivity);
        }).slice(0,1)[0];
        const bundlePotScore = topBundle ? Math.round(topBundle.score/100*15) : 0;
        score += bundlePotScore;
        if(topBundle) reasons.push(`Best bundle candidate: ${topBundle.bundle} (priority ${topBundle.score}/100, ${topBundle.status}).`);

        return { score:Math.min(100,Math.round(score)), reasons, peerRate, inactiveRateThis, topBundle };
    }

    out.fidOpportunities = fids.map(f=>{
        const peers = fids.filter(x=>x.subRegion===f.subRegion&&x.fid!==f.fid);
        const res = opportunityScore(f, peers);
        return {
            fid:f.fid, mbu:f.mbu, subRegion:f.subRegion,
            evc:f.evc||0, inactive:f.inactive||0,
            inactivePct:(f.evc||0)>0?(f.inactive||0)/(f.evc||0):null,
            peerInactivePct:res.peerRate,
            recharge:f.recharge||0, events:f.events||0,
            score:res.score, reasons:res.reasons,
            recommendedBundle:res.topBundle?res.topBundle.bundle:null,
            bundleConfidence:res.topBundle?res.topBundle.confidence:null
        };
    }).sort((a,b)=>b.score-a.score);

    out.mbuOpportunities = mbus.map(m=>{
        const peers = mbus.filter(x=>x.subRegion===m.subRegion&&x.mbu!==m.mbu);
        const res = opportunityScore(m, peers);
        return {
            mbu:m.mbu, subRegion:m.subRegion,
            evc:m.evc||0, inactive:m.inactive||0,
            inactivePct:(m.evc||0)>0?(m.inactive||0)/(m.evc||0):null,
            peerInactivePct:res.peerRate,
            recharge:m.recharge||0, events:m.events||0,
            score:res.score, reasons:res.reasons,
            recommendedBundle:res.topBundle?res.topBundle.bundle:null,
            bundleConfidence:res.topBundle?res.topBundle.confidence:null
        };
    }).sort((a,b)=>b.score-a.score);

    // ── NEXT BEST ACTION (spec §46-53) ──────────────────────────────────────
    const actions=[];
    const risingBundles   = out.bundleMomentum.filter(b=>b.status==='RISING'&&b.events>=activityFloor&&b.monthsUsed>=1&&b.confidence!=='Insufficient History').slice(0,5);
    const decliningHiVal  = out.bundleMomentum.filter(b=>b.status==='DECLINING'&&(b.rechargeShare||0)>=0.03&&b.events>=activityFloor);
    const topOpps         = out.fidOpportunities.filter(o=>o.score>=55).slice(0,3);

    // NBA: Rising Acceleration (spec §47)
    risingBundles.forEach(b=>{
        if(b.priorityScore<50&&out.bundlePriority.find(p=>p.bundle===b.bundle&&p.score<50)) return;
        const hasComm = b.recharge>0;
        if(!hasComm) return; // need commercial evidence
        const pri = out.bundlePriority.find(p=>p.bundle===b.bundle);
        actions.push({
            action:'Rising Bundle Acceleration',
            type:'RISING_ACCELERATION',
            bundle:b.bundle,
            entity:null,
            lift:b.lift,
            eventsPerDay:b.eventsPerDay,
            historicalRate:b.baselineRate,
            slope:b.slope,
            consistency:b.consistency,
            confidence:b.confidence,
            activationShare:b.activationShare,
            rechargeShare:b.rechargeShare,
            rechargePerEvent:b.rechargePerEvent,
            opportunityScore:null,
            triggeringSignal:`RISING: Lift ${((b.lift||0)*100).toFixed(1)}%, slope ${b.slope>0?'positive':'negative'}, consistency ${((b.consistency||0)*100).toFixed(0)}%, ${b.monthsUsed} hist. months.`,
            expectedBenefit:`Accelerate ${b.bundle} distribution. Momentum-backed with ${((b.lift||0)*100).toFixed(1)}% lift and ${((b.rechargeShare||0)*100).toFixed(1)}% recharge share.`
        });
    });

    // NBA: Declining High-Value (spec §48)
    decliningHiVal.slice(0,3).forEach(b=>{
        actions.push({
            action:'Declining Bundle Protection / Investigation',
            type:'DECLINING_HIGHVALUE',
            bundle:b.bundle,
            entity:null,
            lift:b.lift,
            eventsPerDay:b.eventsPerDay,
            historicalRate:b.baselineRate,
            slope:b.slope,
            consistency:b.consistency,
            confidence:b.confidence,
            activationShare:b.activationShare,
            rechargeShare:b.rechargeShare,
            rechargePerEvent:b.rechargePerEvent,
            opportunityScore:null,
            triggeringSignal:`DECLINING: Lift ${((b.lift||0)*100).toFixed(1)}%, Recharge Share ${((b.rechargeShare||0)*100).toFixed(1)}%.`,
            expectedBenefit:`Protect commercially important bundle. Recharge share ${((b.rechargeShare||0)*100).toFixed(1)}%. Understand root cause of ${((b.lift||0)*100).toFixed(1)}% momentum decline.`
        });
    });

    // NBA: Regional Replication (spec §49)
    out.regionMomentum.forEach(r=>{
        r.bundles.slice(0,5).forEach(b=>{
            if(b.events < out.regMinActivity) return;
            const share = b.activationShare||0;
            // Find sub-regions where same bundle is materially weaker
            out.regionMomentum.forEach(r2=>{
                if(r2.subRegion===r.subRegion) return;
                const b2 = r2.bundles.find(x=>x.bundle===b.bundle);
                const share2 = b2 ? (b2.activationShare||0) : 0;
                if(share-share2 >= 0.15 && r2.total >= out.regMinActivity) {
                    const pBundle = out.bundlePriority.find(p=>p.bundle===b.bundle);
                    if(pBundle && (pBundle.rechargeShare||0)>0.02) {
                        actions.push({
                            action:'Regional Replication',
                            type:'REGIONAL_REPLICATION',
                            bundle:b.bundle,
                            entity:`${r.subRegion} → ${r2.subRegion}`,
                            lift:null,
                            eventsPerDay:b.events/Math.max(curDays,1),
                            historicalRate:null,
                            slope:null,
                            consistency:null,
                            confidence:pBundle.confidence,
                            activationShare:share,
                            rechargeShare:pBundle.rechargeShare,
                            rechargePerEvent:pBundle.rechargePerEvent,
                            regionalGap:share-share2,
                            sourceRegion:r.subRegion, targetRegion:r2.subRegion,
                            opportunityScore:null,
                            triggeringSignal:`${b.bundle} leads ${r.subRegion} with ${(share*100).toFixed(1)}% activation share vs ${(share2*100).toFixed(1)}% in ${r2.subRegion} (gap: ${((share-share2)*100).toFixed(1)}pp). Regional min sample: ${out.regMinActivity|0} events.`,
                            expectedBenefit:`Replicate ${b.bundle} success from ${r.subRegion} into ${r2.subRegion}. Addressable share gap: ${((share-share2)*100).toFixed(1)}pp. Recharge/event: ${(pBundle.rechargePerEvent||0).toFixed(1)}.`
                        });
                    }
                }
            });
        });
    });

    // NBA: Opportunity Territory (spec §50)
    topOpps.forEach(o=>{
        if(!o.recommendedBundle) return;
        actions.push({
            action:`Target Inactive Retailer Pool with ${o.recommendedBundle}`,
            type:'OPPORTUNITY_TERRITORY',
            bundle:o.recommendedBundle,
            entity:`${o.mbu} / FID ${o.fid}`,
            lift:null, eventsPerDay:null, historicalRate:null, slope:null, consistency:null,
            confidence:o.bundleConfidence||'Low',
            activationShare:null, rechargeShare:null, rechargePerEvent:null,
            opportunityScore:o.score,
            triggeringSignal:`Opportunity score ${o.score}/100. ${o.reasons.slice(0,2).join(' ')}`,
            expectedBenefit:`Activate ${o.inactive>0?o.inactive.toLocaleString():''} inactive retailers in ${o.mbu}/${o.fid} using ${o.recommendedBundle}. Opportunity score: ${o.score}/100.`
        });
    });

    // NBA: Multiple Declining Sub-Region (spec §51)
    const decByRegion = new Map();
    out.bundleMomentum.filter(b=>b.status==='DECLINING'&&b.events>=activityFloor).forEach(b=>{
        out.regionMomentum.forEach(r=>{
            const rb=r.bundles.find(x=>x.bundle===b.bundle);
            if(rb&&rb.events>0) { const arr=decByRegion.get(r.subRegion)||[]; arr.push(b.bundle); decByRegion.set(r.subRegion,arr); }
        });
    });
    decByRegion.forEach((bundles,sr)=>{
        if(bundles.length>=2) {
            actions.push({
                action:`Investigate Bundle Momentum in ${sr}`,
                type:'MULTI_DECLINING',
                bundle:null, entity:sr,
                lift:null, eventsPerDay:null, historicalRate:null, slope:null, consistency:null,
                confidence:'Medium',
                activationShare:null, rechargeShare:null, rechargePerEvent:null, opportunityScore:null,
                triggeringSignal:`${bundles.length} meaningful bundles declining in ${sr}: ${bundles.slice(0,3).join(', ')}.`,
                expectedBenefit:`Identify root cause of multi-bundle momentum loss in ${sr} before commercial impact expands.`
            });
        }
    });

    // No evidence gate (spec §52)
    if(actions.length===0) {
        actions.push({
            action:'No Strong Action Recommended — Insufficient Evidence',
            type:'NO_ACTION',
            bundle:null, entity:null,
            lift:null, eventsPerDay:null, historicalRate:null, slope:null, consistency:null,
            confidence:'Insufficient History',
            activationShare:null, rechargeShare:null, rechargePerEvent:null, opportunityScore:null,
            triggeringSignal:'No bundle passed all confidence / data-quality / evidence gates.',
            expectedBenefit:'Load additional historical periods to generate defensible intelligence.'
        });
    }
    out.nextBestActions = actions;

    // ── BACKWARD COMPAT ──────────────────────────────────────────────────────
    out.nextBestBundle = {
        growthLeader: out.bundleMomentum.filter(b=>b.status==='RISING'&&b.lift!==null).sort((a,b)=>b.lift-a.lift)[0]||null,
        strongest:    out.bundleMomentum[0]||null,
        underPenetrated: out.bundleMomentum.filter(b=>(b.activationShare||0)<0.08&&(b.lift||0)>0).sort((a,b)=>(b.lift||0)-(a.lift||0))[0]||null,
        comparable: (() => {
            const comp=[];
            out.regionMomentum.forEach(r=>{
                r.bundles.slice(0,5).forEach(b=>{
                    comp.push({ subRegion:r.subRegion, bundle:b.bundle, share:b.activationShare, events:b.events, growth:b.growth });
                });
            });
            return comp;
        })()
    };

    out._bundlePriorityFor = bundlePriorityFor;
    return out;
}

function loadWorkbookFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read the file.'));
        reader.onload = (e) => {
            try {
                const wb = XLSX.read(e.target.result, { type:'array', cellDates:true });
                const need = ['MBU Summary','FID Summary','FID','Recharge Share','EVC BU Report','RECH YTD Growth','RAW'];
                const sheetRefs = {};
                const missing = [];
                need.forEach(n => {
                    const found = findSheet(wb, n);
                    if(!found) missing.push(n);
                    else sheetRefs[n] = found;
                });
                if(missing.length) {
                    reject(new Error('This workbook is missing expected sheet(s): '+missing.join(', ')+'. Make sure you selected the N2 Bundle Upsell Sciences master workbook.'));
                    return;
                }
                const get = (n) => XLSX.utils.sheet_to_json(wb.Sheets[sheetRefs[n]], { header:1, defval:null, raw:true });
                const sheets = {
                    mbuSummary: get('MBU Summary'),
                    fidSummary: get('FID Summary'),
                    fidSheet: get('FID'),
                    rechargeShare: get('Recharge Share'),
                    evcBuReport: get('EVC BU Report'),
                    rechYtdGrowth: get('RECH YTD Growth'),
                    raw: get('RAW')
                };
                resolve(sheets);
            } catch(err) { reject(err); }
        };
        reader.readAsArrayBuffer(file);
    });
}
