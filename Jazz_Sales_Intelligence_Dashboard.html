function detectMonth(dateStr){
  if(!dateStr) return null;
  const parts = dateStr.split('-');
  if(parts.length < 2) return null;
  return parts[0] + '-' + parts[1];
}
function monthLabel(ym){
  if(!ym) return 'Unknown';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p = ym.split('-');
  if(p.length<2) return ym;
  return months[(+p[1])-1] + ' ' + p[0];
}

function handleFiles(files) {
    const xlsxFiles = files.filter(f => /\.xlsx$/i.test(f.name));
    if(!xlsxFiles.length) {
        renderLoader('That doesn\'t look like an .xlsx file. Please select the master workbook file(s).');
        return;
    }
    document.getElementById('loader-progress').classList.add('show');
    document.getElementById('loader-bar').style.width = '20%';
    document.getElementById('loader-status').textContent = 'Reading ' + xlsxFiles.length + ' source file(s) …';
    document.getElementById('loader-status').classList.remove('err');

    const promises = xlsxFiles.map((file, idx) => loadWorkbookFile(file).then(sheets => {
        document.getElementById('loader-bar').style.width = 20 + Math.round(50 * (idx+1) / xlsxFiles.length) + '%';
        const ds = buildDataset(sheets);
        ds.fileName = file.name;
        ds.reportingPeriod = detectMonth(ds.dateRange && ds.dateRange.max);
        return ds;
    }));

    Promise.all(promises).then(datasets => {
        datasets.sort((a,b) => (a.dateRange && a.dateRange.min || '') < (b.dateRange && b.dateRange.min || '') ? -1 : 1);
        const current = datasets[datasets.length - 1];
        const historical = datasets.slice(0, -1);
        document.getElementById('loader-bar').style.width = '80%';
        document.getElementById('loader-status').textContent = 'Building intelligence layer …';
        setTimeout(() => {
            try {
                const intel = buildIntelligence(current, historical);
                DATA = {
                    ...current,
                    sources: datasets,
                    historical: historical,
                    intel: intel,
                    reportingPeriod: current.reportingPeriod,
                    currentMonthLabel: monthLabel(current.reportingPeriod),
                    meta: {
                        reportingPeriod: current.reportingPeriod,
                        generatedAt: Date.now(),
                        schemaVersion: SCHEMA_VERSION,
                        dataVersion: (current.reportingPeriod || '') + '-' + (current.fileName || '') + '-' + Date.now()
                    },
                    sourceInfo: datasets.map(d => ({
                        fileName: d.fileName,
                        period: monthLabel(d.reportingPeriod),
                        dateRange: d.dateRange
                    }))
                };
                setCache(DATA);
                CACHE_USED = false;
                document.getElementById('loader-bar').style.width = '100%';
                document.getElementById('loader-status').textContent = '✓ Loaded and cached. Launching …';
                setTimeout(() => launchDashboard(DATA, 'uploaded files'), 180);
            } catch(err) {
                console.error(err);
                renderLoader('Something went wrong while building the model: ' + err.message);
            }
        }, 30);
    }).catch(err => {
        console.error(err);
        renderLoader(err.message);
    });
}

<script>

function fmtInt(v) {
    if(v===null||v===undefined) return '—';
    const a = Math.abs(v);
    if(a>=1e9) return (v/1e9).toFixed(1)+'B';
    if(a>=1e6) return (v/1e6).toFixed(1)+'M';
    if(a>=1e3) return (v/1e3).toFixed(1)+'K';
    return Math.round(v).toLocaleString('en-US');
}
function fmtIntFull(v) { return (v===null||v===undefined) ? '—' : Math.round(v).toLocaleString('en-US'); }
function fmtPct(v) { return (v===null||v===undefined) ? 'N/A' : (v*100).toFixed(1)+'%'; }
function fmtMoney(v) {
    if(v===null||v===undefined) return '—';
    const a = Math.abs(v);
    if(a>=1e9) return '₨'+(v/1e9).toFixed(2)+'B';
    if(a>=1e6) return '₨'+(v/1e6).toFixed(1)+'M';
    if(a>=1e3) return '₨'+(v/1e3).toFixed(1)+'K';
    return '₨'+Math.round(v).toLocaleString('en-US');
}
function fmtCompactNum(v) {
    if(v===null||v===undefined) return '—';
    const a = Math.abs(v);
    if(a>=1e9) return (v/1e9).toFixed(2)+'B';
    if(a>=1e6) return (v/1e6).toFixed(1)+'M';
    if(a>=1e3) return (v/1e3).toFixed(1)+'K';
    return Math.round(v).toLocaleString('en-US');
}
function esc(s) { return String(s==null?'—':s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function naturalSortKey(s) {
    if(s==null) return '';
    const parts = String(s).match(/(\d+)|(\D+)/g) || [String(s)];
    return parts.map(p => isNaN(p) ? p : String(parseInt(p,10)).padStart(10,'0')).join('');
}
function naturalSort(a,b) { return naturalSortKey(a).localeCompare(naturalSortKey(b)); }
function quantile(arr, q) {
    const s = [...arr].sort((a,b)=>a-b);
    if(!s.length) return null;
    const pos = (s.length-1)*q, base = Math.floor(pos), rest = pos-base;
    return s[base+1] !== undefined ? s[base] + rest*(s[base+1]-s[base]) : s[base];
}

const App = {};
window.App = App;

// Main UI controller: initializes regional benchmarks, manages hierarchy filter state,
// and renders each interactive view (Overview, Intelligence, MBU, FID, Bundles, Opportunities, Data Quality).
App.boot = function(DATA) {
    if (!DATA || !Array.isArray(DATA.mbus) || !Array.isArray(DATA.fids) ||
        !Array.isArray(DATA.rawData) || !DATA.dateRange || !DATA.intel) {
        throw new Error('The dashboard data is incomplete (MBU, FID, RAW, date range, or Intelligence data is missing).');
    }
    const { mbus, fids } = DATA;
    const fidInactiveVals = fids.filter(f => f.evc>0).map(f => f.inactivePct).filter(v => v!==null);
    const fidActiveVals = fids.filter(f => f.evc>0).map(f => f.activePct).filter(v => v!==null);
    const BENCH = {
        inactiveMedian: quantile(fidInactiveVals, 0.5),
        inactiveQ3: quantile(fidInactiveVals, 0.75),
        activeQ3: quantile(fidActiveVals, 0.75)
    };

    const state = {
        view: 'overview',
        subRegion: 'All',
        mbu: 'All',
        fid: 'All',
        opGrain: 'fid',
        opThreshold: Math.round(BENCH.inactiveQ3*100)/100,
        healthCompareBy: 'Recharge',
        dailyFactor: 'Recharge',
        dailyLevel: 'Region',
        dailySel1: null,
        dailySel2: null,
        dailySel3: null,
        dailyKpi: 'Activation Events',
        intKpi: 'Events',
        intValidity: 'All',
        intBundleType: 'All'
    };
    // Keeps rebuilt decision models in memory. Excel is parsed only at load;
    // filter changes reuse normalized data and calculate each scope once.
    const scopedDecisionCache = new Map();

    function mbusInScope() {
        return state.subRegion === 'All' ? mbus : mbus.filter(m => m.subRegion === state.subRegion);
    }
    function fidsInScope() {
        let f = fids;
        if(state.subRegion !== 'All') f = f.filter(x => x.subRegion === state.subRegion);
        if(state.mbu !== 'All') f = f.filter(x => x.mbu === state.mbu);
        return f;
    }
    function aggregate(rows) {
        const sum = k => rows.reduce((a,r) => a + (r[k]||0), 0);
        const evc = sum('evc'), active = sum('active'), inactive = sum('inactive');
        return {
            evc, active, inactive,
            activePct: evc>0 ? active/evc : null,
            inactivePct: evc>0 ? inactive/evc : null,
            recharge: sum('recharge'),
            revenue: sum('revenue'),
            events: sum('events'),
            commission: sum('commission'),
            subs90d: sum('subs90d'),
            growthMay: rows.length ? rows.reduce((a,r) => a + (r.growthMay||0),0)/rows.length : null,
            buRecharge: sum('buRecharge')
        };
    }
    function currentKpis() {
        if(state.fid !== 'All') { const row = fids.find(f => f.fid === state.fid); return { label: 'FID '+state.fid, ...row }; }
        if(state.mbu !== 'All') { const row = mbus.find(m => m.mbu === state.mbu); return { label: state.mbu, ...row }; }
        const scope = mbusInScope();
        return { label: state.subRegion === 'All' ? 'North' : state.subRegion, ...aggregate(scope) };
    }
    function currentTrend() {
        if(state.mbu !== 'All') return DATA.trendByMbu.filter(t => t.mbu === state.mbu);
        if(state.subRegion !== 'All') return DATA.trendBySubRegion.filter(t => t.subRegion === state.subRegion);
        return DATA.trend;
    }
    function opportunityFlag(activePct, inactivePct) {
        if(inactivePct === null) return { flag:'nodata', reason:'Retailer base is zero or unrecorded — cannot assess health for this row.' };
        if(inactivePct >= state.opThreshold) return { flag:'high', reason:`Inactive retailer share (${fmtPct(inactivePct)}) is at or above the ${fmtPct(state.opThreshold)} threshold — activation opportunity.` };
        if(inactivePct >= BENCH.inactiveMedian) return { flag:'watch', reason:`Inactive retailer share (${fmtPct(inactivePct)}) is above the North-wide median (${fmtPct(BENCH.inactiveMedian)}) — worth monitoring.` };
        if(activePct !== null && activePct >= BENCH.activeQ3) return { flag:'strong', reason:`Active retailer share (${fmtPct(activePct)}) is in the top quartile North-wide — strong performance.` };
        return { flag:'normal', reason:'Retailer health is within the normal range for the North region.' };
    }

    const chartInstances = {};
    function makeChart(id, config) {

              <button class="reload-btn" id="clear-cache-btn" style="border-color:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);"><span>🗑</span> <span>Clear cache</span></button>

    function renderRail() {
        const el = document.getElementById('rail-nav');
        el.innerHTML = NAV_ITEMS.map(n => `<button class="rail-btn ${state.view===n.id?'active':''}" data-nav="${n.id}">${sigIcon()}<span>${n.label}</span></button>`).join('');
        el.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.nav; renderRail(); renderTopbar(); renderView(); }));
    }

    function renderTopbar() {
        const titles = {
            overview: ['Regional Overview', 'Regional sales performance & opportunity dashboard'],

        };

        const subRegions = ['All', ...new Set(mbus.map(m => m.subRegion))].sort((a,b) => { if(a==='All') return -1; if(b==='All') return 1; return naturalSort(a,b); });

        const fidOptions = ['All', ...fidsInScope().map(f => f.fid)].sort((a,b) => { if(a==='All') return -1; if(b==='All') return 1; return naturalSort(a,b); });
        if(!mbuOptions.includes(state.mbu)) state.mbu = 'All';
        if(!fidOptions.includes(state.fid)) state.fid = 'All';

          <div class="filter-field"><label>MBU</label><select id="f-mbu">${mbuOptions.map(v=>`<option ${v===state.mbu?'selected':''} style="${v===state.mbu?'font-weight:700;font-size:13.5px;':''}">${v}</option>`).join('')}</select></div>
          <div class="filter-field"><label>FID</label><select id="f-fid">${fidOptions.map(v=>`<option ${v===state.fid?'selected':''} style="${v===state.fid?'font-weight:700;font-size:13.5px;':''}">${v}</option>`).join('')}</select></div>

        document.getElementById('f-mbu').addEventListener('change', e => { state.mbu = e.target.value; state.fid='All'; renderTopbar(); renderView(); });
        document.getElementById('f-fid').addEventListener('change', e => { state.fid = e.target.value; renderTopbar(); renderView(); });
        document.getElementById('f-reset').addEventListener('click', () => { state.subRegion='All'; state.mbu='All'; state.fid='All'; renderTopbar(); renderView(); });

    function renderView() {

        })[state.view];

        <div class="section-label"><span class="sig"><i></i><i></i><i></i></span>Daily Performance — Interactive Comparison</div>

        worst.forEach(f => { const o = opportunityFlag(f.activePct, f.inactivePct); if(o.flag==='high'||o.flag==='watch') attnHtml += `<div class="attn-item ${o.flag}"><div class="attn-icon">${o.flag==='high'?'!':'~'}</div><div class="attn-body"><b>FID ${esc(f.fid)} · ${esc(f.mbu)}</b><p>${o.reason}</p></div></div>`; });
        best.forEach(f => { attnHtml += `<div class="attn-item strong"><div class="attn-icon">✓</div><div class="attn-body"><b>FID ${esc(f.fid)} · ${esc(f.mbu)}</b><p>Active retailer share of ${fmtPct(f.activePct)} — one of the strongest in scope.</p></div></div>`; });
        document.getElementById('attn-list').innerHTML = attnHtml || `<div class="empty-state">No flagged items in this selection.</div>`;

        const insights = [];
        insights.push(`Active retailer penetration is <b>${fmtPct(k.activePct)}</b> for ${esc(k.label)}.`);
        insights.push(`Inactive retailers represent <b>${fmtPct(k.inactivePct)}</b> of the retailer base in this selection.`);
        if(state.fid !== 'All') {
            const f = fids.find(x => x.fid === state.fid);
            if(f && f.topEventsBundles.length) insights.push(`Leading bundle by activation events: <b>${esc(f.topEventsBundles[0].name)}</b> — ${fmtPct(f.topEventsBundles[0].contrib)} of this FID's events.`);

        const strongestSr = srs.map(sr => ({ sr, a: aggregate(mbus.filter(m => m.subRegion === sr)) })).sort((a,b) => b.a.activePct - a.a.activePct)[0];
        if(strongestSr) insights.push(`<b>${esc(strongestSr.sr)}</b> currently has the highest active-retailer share among sub-regions, at ${fmtPct(strongestSr.a.activePct)}.`);
        document.getElementById('insight-list').innerHTML = insights.map(t => `<div class="insight-item"><div class="dot"></div><div>${t}</div></div>`).join('');
    }

    /* ===== RETAILER HEALTH COMPARISON ===== */
    function renderHealthComparison() {
    const container = document.getElementById('health-comp-container');
    if(!container) return;
    const compareBy = state.healthCompareBy || 'Recharge';
    
    // Key mapping: display label -> data property
    const KEY_MAP = {
        'Recharge': 'recharge',
        'Revenue': 'revenue',
        'BU Recharge': 'buRecharge',
        'Activation Events': 'events',
        'Commission': 'commission',
        'Active Retailers': 'active',
        'Inactive Retailers': 'inactive',
        'EVC Retailer Base': 'evc',
        'Subs 90D': 'subs90d'
    };
    const dataKey = KEY_MAP[compareBy] || 'recharge';
    const isMoneyMetric = ['recharge','revenue','buRecharge','commission'].includes(dataKey);
    const isRetailerMetric = ['active','inactive','evc'].includes(dataKey);
    const fmtVal = isMoneyMetric ? fmtMoney : fmtInt;
    
    if(state.fid !== 'All') {
        const fid = fids.find(f => f.fid === state.fid);
        if(fid) {
            const hasTss = fid.tss && fid.tss.length > 0;
            container.innerHTML = `
            <div class="health-comp-title">FID Retailer Health — ${esc(fid.fid)} <span class="sub">· Detail</span></div>
            <div style="padding:12px 0;font-size:13px;line-height:1.8;">
              ${hasTss ? `
                <div><strong>TSS:</strong> ${esc(fid.tss)}</div>
                <div><strong>MBU:</strong> ${esc(fid.mbu)}</div>
                <div><strong>Sub-region:</strong> ${esc(fid.subRegion)}</div>
                <div><strong>Active retailers:</strong> ${fmtInt(fid.active)} / ${fmtInt(fid.evc)} (${fmtPct(fid.activePct)})</div>
                <div><strong>Inactive retailers:</strong> ${fmtInt(fid.inactive)} (${fmtPct(fid.inactivePct)})</div>
                <div><strong>Recharge:</strong> ${fmtMoney(fid.recharge)}</div>
                <div><strong>Commission:</strong> ${fmtMoney(fid.commission)}</div>
              ` : `<div style="color:var(--ink-faint);font-size:14px;">Data unavailable — no record for FID ${esc(fid.fid)}.</div>`}
            </div>`;
            return;
        }
    }
    
    let compareEntities = [];
    let level = '';
    let title = '';
    
    if(state.mbu !== 'All' && state.fid === 'All') {
        compareEntities = fids.filter(f => f.mbu === state.mbu && f.evc > 0);
        level = 'FID';
        title = `FID Comparison — ${esc(state.mbu)}`;
    } else if(state.subRegion !== 'All' && state.mbu === 'All') {
        compareEntities = mbus.filter(m => m.subRegion === state.subRegion);
        level = 'MBU';
        title = `MBU Comparison — ${esc(state.subRegion)}`;
    } else {
        const srSet = new Set(mbus.map(m => m.subRegion));
        compareEntities = [...srSet].map(sr => {
            const agg = aggregate(mbus.filter(m => m.subRegion === sr));
            return { name: sr, ...agg };
        });
        level = 'Region';
        title = 'Regional Comparison';
    }
    
    compareEntities.sort((a,b) => {
        const va = a[dataKey] || 0;
        const vb = b[dataKey] || 0;
        return vb - va;
    });
    
    // Filter compare options to only those with data
    const ALL_OPTIONS = [
        { label: 'Recharge', key: 'recharge' },
        { label: 'Activation Events', key: 'events' },
        { label: 'Commission', key: 'commission' },
        { label: 'Revenue', key: 'revenue' },
        { label: 'BU Recharge', key: 'buRecharge' },
        { label: 'Active Retailers', key: 'active' },
        { label: 'Inactive Retailers', key: 'inactive' },
        { label: 'EVC Retailer Base', key: 'evc' },
        { label: 'Subs 90D', key: 'subs90d' }
    ];
    const compareOptions = ALL_OPTIONS.filter(opt => {
        return compareEntities.some(e => (e[opt.key] || 0) > 0);
    }).map(opt => opt.label);
    
    const maxVal = Math.max(...compareEntities.map(e => e[dataKey] || 0), 0);
    
    let rowsHtml = compareEntities.map(entity => {
        const name = entity.name || entity.mbu || entity.fid || '—';
        const val = entity[dataKey] || 0;
        const pct = maxVal > 0 ? (val / maxVal) : 0;
        const barWidth = Math.round(pct * 100);
        const activePct = entity.activePct;
        const inactivePct = entity.inactivePct;
        const evc = entity.evc || 0;
        
        // Determine bar rendering
        let barHtml = '';
        if(isRetailerMetric && evc > 0 && entity.active !== undefined) {
            // Stacked bar: navy for active, red for inactive
            const activeW = Math.round((entity.active / evc) * 100);
            const inactiveW = 100 - activeW;
            barHtml = `<div class="health-comp-bar" style="width:${barWidth}%">
                <div class="fill-active" style="width:${activeW}%" title="Active: ${fmtInt(entity.active)} (${fmtPct(activePct)})"></div>
                <div class="fill-inactive" style="width:${inactiveW}%" title="Inactive: ${fmtInt(entity.inactive)} (${fmtPct(inactivePct)})"></div>
            </div>`;
        } else {
            barHtml = `<div class="health-comp-bar"><div class="fill-metric" style="width:${barWidth}%"></div></div>`;
        }
        
        let metaHtml = `<div class="health-comp-meta">${compareBy}: ${fmtVal(val)}`;
        if(isRetailerMetric && evc > 0) {
            metaHtml += ` <span style="margin-left:8px;">Active rate ${fmtPct(activePct)} · Inactive rate ${fmtPct(inactivePct)}</span>`;
        } else {
            metaHtml += ` <span style="margin-left:8px;">${Math.round(pct*100)}% of top performer</span>`;
        }
        if(evc > 0 && activePct !== null && inactivePct !== null && !isRetailerMetric) {
            metaHtml += ` <span style="margin-left:8px;">Active ${fmtPct(activePct)} · Inactive ${fmtPct(inactivePct)}</span>`;
        }
        metaHtml += `</div>`;
        
        return `<div class="health-comp-row">
            <div class="health-comp-name">${esc(name)}</div>
            <div class="health-comp-bar-wrap">${barHtml}${metaHtml}</div>
            <div class="health-comp-val">${fmtVal(val)}</div>
          </div>`;
    }).join('');
    
    container.innerHTML = `
    <div class="health-comp-controls">
      <div class="field"><label>Compare By</label>
        <select id="health-compare-by">${compareOptions.map(o => `<option ${o===compareBy?'selected':''}>${o}</option>`).join('')}</select>
      </div>
      <div style="font-size:11px;color:var(--ink-faint);font-weight:500;">Showing ${compareEntities.length} ${level}(s)</div>
    </div>
    <div class="health-comp-title">${title} <span class="sub">· ${compareBy}</span></div>
    <div style="max-height:340px;overflow-y:auto;padding-right:4px;">
      ${rowsHtml || `<div class="empty-state">No entities to compare at this level.</div>`}
    </div>
    ${isRetailerMetric ? `<div class="health-comp-legend">
        <div class="leg-item"><div class="leg-swatch" style="background:var(--navy);"></div>Active Retailers</div>
        <div class="leg-item"><div class="leg-swatch" style="background:var(--red);"></div>Inactive Retailers</div>
    </div>` : ''}`;
    
    document.getElementById('health-compare-by')?.addEventListener('change', e => {
        state.healthCompareBy = e.target.value;
        renderHealthComparison();
    });
}

    /* ===== DAILY PERFORMANCE COMPARISON ===== */
    const DAILY_KPIS = {
        'Activation Events': { key:'events',     kind:'daily',   unit:'int',   label:'Activation Events' },
        'Recharge':          { key:'recharge',   kind:'daily',   unit:'money', label:'Recharge' },
        'Commission':        { key:'commission', kind:'daily',   unit:'money', label:'Commission' }
    };
    const DP_PALETTE = ['#D6112C', '#1F3A5F', '#1F8A55', '#B4700A', '#7A6FF0', '#0E7C86'];

    function dailyTrendRows(entity, level) {
        if(level === 'Region') return (DATA.trendBySubRegion||[]).filter(t => t.subRegion === entity);
        if(level === 'MBU') return (DATA.trendByMbu||[]).filter(t => t.mbu === entity);
        if(level === 'FID') return (DATA.trendByFid||[]).filter(t => t.fid === entity);
        return [];
    }
    function monthlyEntityStats(entity, level) {
        if(level === 'Region') return aggregate(mbus.filter(m => m.subRegion === entity));
        if(level === 'MBU') { const m = mbus.find(x => x.mbu === entity); return m ? { evc:m.evc, active:m.active, inactive:m.inactive, events:m.events, recharge:m.recharge, revenue:m.revenue, commission:m.commission, subs90d:m.subs90d, buRecharge:m.buRecharge } : null; }
        if(level === 'FID') { const f = fids.find(x => x.fid === entity); return f ? { evc:f.evc, active:f.active, inactive:f.inactive, events:f.events, recharge:f.recharge, revenue:f.revenue, commission:f.commission, subs90d:f.subs90d, buRecharge:f.buRecharge } : null; }
        return null;
    }
    function prevRawByEntity(entity, level) {
        const hist = (DATA.historical && DATA.historical.length) ? DATA.historical[DATA.historical.length-1] : null;
        if(!hist || !hist.rawData) return null;
        let rows = hist.rawData;
        if(level === 'Region') rows = rows.filter(r => r.subRegion === entity);
        else if(level === 'MBU') rows = rows.filter(r => r.mbu === entity);
        else if(level === 'FID') rows = rows.filter(r => r.fid === entity);
        return rows;
    }
    function dailyEntityValue(entity, level, def) {
        if(def.kind === 'daily') return dailyTrendRows(entity, level).reduce((a,d) => a + (d[def.key]||0), 0);
        if(def.kind === 'monthly') { const st = monthlyEntityStats(entity, level); return st ? (st[def.key]||0) : 0; }
        const st = monthlyEntityStats(entity, level);
        return st ? (def.key === 'eventGrowth' ? (st.events||0) : (st.recharge||0)) : 0;
    }
    function dailyGrowthOf(entity, level, def) {
        const st = monthlyEntityStats(entity, level);
        if(!st) return null;
        const prev = prevRawByEntity(entity, level);
        if(!prev) return null;
        const prevEvents = prev.reduce((a,r) => a + (r.events||0), 0);
        const prevRecharge = prev.reduce((a,r) => a + (r.recharge||0), 0);
        if(def.key === 'eventGrowth') return pctGrowth(st.events||0, prevEvents);
        return pctGrowth(st.recharge||0, prevRecharge);
    }
    const kpiFmtFn = def => def.unit === 'money' ? fmtMoney : (def.unit === 'pct' ? v => (v>=0?'+':'') + v.toFixed(1) + '%' : fmtInt);

    function renderDailyPerformanceComparison() {
        const container = document.getElementById('daily-perf-container');
        if(!container) return;

        const kpi = state.dailyKpi || 'Activation Events';
        const level = state.dailyLevel || 'Region';
        const sel1 = state.dailySel1;
        const sel2 = state.dailySel2;
        const sel3 = state.dailySel3;

        let entities = [];
        if(level === 'Region') {
            entities = [...new Set(mbus.map(m => m.subRegion))].sort(naturalSort);
        } else if(level === 'MBU') {
            const scope = state.subRegion !== 'All' ? mbus.filter(m => m.subRegion === state.subRegion) : mbus;
            entities = [...new Set(scope.map(m => m.mbu))].sort(naturalSort);
        } else {
            entities = [...new Set(fidsInScope().map(f => f.fid))].sort(naturalSort);
        }

        const KPI_DEF = DAILY_KPIS[kpi] || DAILY_KPIS['Activation Events'];
        const userChosen = [sel1, sel2, sel3].filter(v => v !== null && v !== undefined && v !== '');
        let selectedVals = userChosen.slice();
        let autoNote = '';
        if(selectedVals.length < 2 && entities.length > 0) {
            const ranked = entities.slice().sort((a,b) => (dailyEntityValue(b, level, KPI_DEF) || 0) - (dailyEntityValue(a, level, KPI_DEF) || 0));
            const auto = ranked.slice(0, 3);
            selectedVals = [sel1, sel2, sel3].map((v,i) => v || auto[i]).filter(v => v && v !== undefined && v !== null && v !== '');
            state.dailySel1 = selectedVals[0] || null;
            state.dailySel2 = selectedVals[1] || null;
            state.dailySel3 = selectedVals[2] || null;
            if(userChosen.length === 0) autoNote = 'No entities selected — auto-selected the top 3 by current KPI.';
        }

        const available = entities.filter(e => !selectedVals.includes(e));
        function buildOpts(selVal, idx) {
            const currentSelected = selectedVals.filter((v,i) => i !== idx);
            const opts = entities.filter(e => !currentSelected.includes(e) || e === selVal);
            return opts.map(e => `<option value="${esc(e)}" ${e===selVal?'selected':''}>${esc(e)}</option>`).join('');
        }

        const isValid = selectedVals.length >= 2;
        const validationMsg = !isValid ? 'Please select at least two entities for comparison.' : '';

        container.innerHTML = `
        <div class="daily-comp-controls">
          <div class="field"><label>KPI</label>
            <select id="daily-kpi">${Object.values(DAILY_KPIS).map(d => `<option value="${esc(d.label)}" ${d.label===kpi?'selected':''}>${esc(d.label)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Comparison Level</label>
            <select id="daily-level"><option ${level==='Region'?'selected':''}>Region</option><option ${level==='MBU'?'selected':''}>MBU</option><option ${level==='FID'?'selected':''}>FID</option></select>
          </div>
          <div class="field field-selector"><label>Entity 1</label>
            <select id="daily-sel1"><option value="">— Select —</option>${buildOpts(selectedVals[0],0)}</select>
          </div>
          <div class="field field-selector"><label>Entity 2</label>
            <select id="daily-sel2"><option value="">— Select —</option>${buildOpts(selectedVals[1],1)}</select>
          </div>
          <div class="field field-selector"><label>Entity 3</label>
            <select id="daily-sel3"><option value="">— Select —</option>${buildOpts(selectedVals[2],2)}</select>
          </div>
          ${autoNote ? `<div class="daily-comp-validation" style="color:var(--ink-soft);background:var(--surface-2);border-color:var(--border);font-weight:500;">${autoNote}</div>` : ''}
          ${!isValid ? `<div class="daily-comp-validation">${validationMsg}</div>` : ''}
        </div>
        <div class="chart-wrap" style="height:300px;margin-top:4px;"><canvas id="chart-daily-comp"></canvas></div>
        <div id="daily-perf-insight"></div>`;

        document.getElementById('daily-kpi')?.addEventListener('change', e => { state.dailyKpi = e.target.value; renderDailyPerformanceComparison(); });
        document.getElementById('daily-level')?.addEventListener('change', e => { state.dailyLevel = e.target.value; state.dailySel1 = null; state.dailySel2 = null; state.dailySel3 = null; renderDailyPerformanceComparison(); });
        document.getElementById('daily-sel1')?.addEventListener('change', e => { state.dailySel1 = e.target.value || null; renderDailyPerformanceComparison(); });
        document.getElementById('daily-sel2')?.addEventListener('change', e => { state.dailySel2 = e.target.value || null; renderDailyPerformanceComparison(); });
        document.getElementById('daily-sel3')?.addEventListener('change', e => { state.dailySel3 = e.target.value || null; renderDailyPerformanceComparison(); });

        if(isValid) {
            drawDailyComparisonChart(selectedVals, kpi, level);
            renderPerformanceInsightCompact(selectedVals, kpi, level);
        } else {
            const canvas = document.getElementById('chart-daily-comp');
            if(canvas) {
                makeChart('chart-daily-comp', {
                    type: 'line',
                    data: { labels: ['No data'], datasets: [{ label: 'Select at least two entities', data: [0], borderColor:'#CCC', backgroundColor:'rgba(200,200,200,0.2)' }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }
            document.getElementById('daily-perf-insight').innerHTML = '';
        }
    }

    function drawDailyComparisonChart(selectedVals, kpi, level) {
        const canvas = document.getElementById('chart-daily-comp');
        if(!canvas) return;

        const def = DAILY_KPIS[kpi] || DAILY_KPIS['Activation Events'];
        const fmtFn = kpiFmtFn(def);

        if(def.kind === 'daily') {
            const allDates = new Set();
            const entityData = {};
            selectedVals.forEach(entity => {
                const rows = dailyTrendRows(entity, level);
                rows.forEach(d => allDates.add(d.date));
                entityData[entity] = rows;
            });
            const sortedDates = [...allDates].sort();
            const datasets = selectedVals.map((entity, i) => {
                const map = {};
                (entityData[entity] || []).forEach(d => { map[d.date] = d[def.key] || 0; });
                const data = sortedDates.map(date => map[date] || 0);
                return {
                    label: entity,
                    data: data,
                    borderColor: DP_PALETTE[i % DP_PALETTE.length],
                    backgroundColor: 'transparent',
                    tension: 0.2,
                    pointRadius: 1.5,
                    borderWidth: 2
                };
            });
            makeChart('chart-daily-comp', {
                type: 'line',
                data: { labels: sortedDates.map(d => d.slice(5)), datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top', labels: { boxWidth: 10, font: { size: 11 } } },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    return ctx.dataset.label + ': ' + fmtFn(ctx.parsed.y);
                                }
                            }
                        }
                    },
                    scales: {
                        y: { ticks: { font: CHART_FONT, callback: v => fmtFn(v) }, grid: { color: '#EEEFF3' } },
                        x: { ticks: { font: CHART_FONT, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { display: false } }
                    }
                }
            });
            return;
        }

        // Retailer / Growth KPIs have no daily trend — show per-entity totals as horizontal bars
        const rows = selectedVals.map(entity => {
            let value = null, sub = null;
            if(def.kind === 'monthly') {
                const st = monthlyEntityStats(entity, level);
                value = st ? (st[def.key]||0) : 0;
            } else {
                value = dailyGrowthOf(entity, level, def);
                const st = monthlyEntityStats(entity, level);
                sub = st ? (def.key === 'eventGrowth' ? (st.events||0) : (st.recharge||0)) : 0;
            }
            return { entity, value, sub };
        });
        const hasHistory = !!(DATA.historical && DATA.historical.length);
        const barColor = r => {
            if(def.kind !== 'growth') return '#1F3A5F';
            if(r.value === null) return '#CCC';
            return r.value >= 0 ? '#1F8A55' : '#D6112C';
        };
        makeChart('chart-daily-comp', {
            type: 'bar',
            data: {
                labels: rows.map(r => r.entity),
                datasets: [{
                    label: kpi,
                    data: rows.map(r => (def.kind === 'growth' && r.value === null) ? 0 : r.value),
                    backgroundColor: rows.map(barColor),
                    borderRadius: 4
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(ctx) {
                                const r = rows[ctx.dataIndex];
                                if(def.kind === 'growth') {
                                    if(r.value === null) return 'Growth n/a (no previous period)';
                                    return (r.value>=0?'+':'') + (r.value*100).toFixed(1) + '%' + (r.sub!==null && r.sub!==undefined ? ' · current ' + (def.key==='eventGrowth'?fmtInt(r.sub):fmtMoney(r.sub)) : '');
                                }
                                return fmtFn(ctx.parsed.x);
                            }
                        }
                    }
                },
                scales: {
                    x: { ticks: { font: CHART_FONT, callback: v => fmtFn(v) }, grid: { color: '#EEEFF3' } },
                    y: { ticks: { font: CHART_FONT }, grid: { display: false } }
                }
            }
        });
        if(!hasHistory) {
            const note = document.createElement('div');
            note.className = 'daily-comp-validation';
            note.style.cssText = 'margin-top:8px;color:var(--ink-faint);background:var(--surface-2);border-color:var(--border);font-weight:500;';
            note.textContent = def.kind === 'growth' ? 'Insufficient historical data — growth vs previous period could not be computed. Load current + historical months together.' : 'No daily trend data — showing monthly totals for the selected period.';
            canvas.parentNode.appendChild(note);
        }
    }

    function renderPerformanceInsightCompact(selectedVals, kpi, level) {
        const container = document.getElementById('daily-perf-insight');
        if(!container) return;

        const def = DAILY_KPIS[kpi] || DAILY_KPIS['Activation Events'];
        const fmtFn = kpiFmtFn(def);

        const rows = selectedVals.map(entity => {
            let total = null, growth = null;
            if(def.kind === 'daily') {
                total = dailyTrendRows(entity, level).reduce((a,d) => a + (d[def.key]||0), 0);
            } else if(def.kind === 'monthly') {
                const st = monthlyEntityStats(entity, level);
                total = st ? (st[def.key]||0) : 0;
            } else {
                const st = monthlyEntityStats(entity, level);
                total = st ? (def.key === 'eventGrowth' ? (st.events||0) : (st.recharge||0)) : 0;
                growth = dailyGrowthOf(entity, level, def);
            }
            return { entity, total, growth };
        });

        const totalSum = rows.reduce((a,r) => a + (r.total||0), 0);
        const sorted = rows.slice().sort((a,b) => (b.total||0) - (a.total||0));
        const top = sorted[0], low = sorted[sorted.length-1];
        const topShare = totalSum>0 ? (top.total||0)/totalSum : null;
        const hasHistory = !!(DATA.historical && DATA.historical.length);

        const psi = (k, v, cls) => `<div class="psi ${cls||''}"><div class="psi-k">${k}</div><div class="psi-v">${v}</div></div>`;
        let html = '<div class="perf-insight-strip">';

        if(def.kind === 'growth') {
            const withG = rows.filter(r => r.growth !== null).sort((a,b) => b.growth - a.growth);
            const best = withG[0], worst = withG[withG.length-1];
            html += psi('Best Growth', best ? fmtFn(best.growth) + ' <small>' + esc(best.entity) + '</small>' : '—', best && best.growth>0 ? 'lead' : 'na');
            html += psi('Worst Growth', worst ? fmtFn(worst.growth) + ' <small>' + esc(worst.entity) + '</small>' : '—', worst && worst.growth<0 ? 'lag' : 'na');
            if(best && worst && withG.length > 1) html += psi('Spread', fmtFn(best.growth - worst.growth));
        } else {
            html += psi('Total ' + esc(kpi), fmtFn(totalSum));
            html += psi('Leader', (top ? esc(top.entity) : '—') + ' <small>' + fmtFn(top ? top.total : 0) + '</small>', topShare!==null && topShare>=0.4 ? 'lead' : '');
            html += psi('Leader Share', topShare!==null ? Math.round(topShare*100)+'%' : '—', topShare!==null && topShare>=0.4 ? 'lead' : '');
            html += psi('Lowest', (low ? esc(low.entity) : '—') + ' <small>' + fmtFn(low ? low.total : 0) + '</small>', low && totalSum>0 && (low.total||0)/totalSum < 0.1 ? 'lag' : '');
        }
        html += '</div>';

        const notes = [];
        if(def.kind === 'monthly') notes.push('No daily trend data — showing monthly totals for the selected period.');
        if(def.kind === 'growth' && !hasHistory) notes.push('Insufficient historical data — growth vs previous period could not be computed.');
        if(notes.length) html += `<div class="daily-comp-validation" style="margin-top:8px;color:var(--ink-faint);background:var(--surface-2);border-color:var(--border);font-weight:500;">${notes.join(' ')}</div>`;

        container.innerHTML = html;
    }

    /* ===== INTELLIGENCE PAGE ===== */
    function statusPill(status){
        const cls = ({RISING:'strong', STABLE:'normal', DECLINING:'high', EMERGING:'watch', DORMANT:'nodata'})[status] || 'normal';
        return `<span class="pill ${cls}">${esc(status)}</span>`;
    }
    function growthHtml(g){
        if(g === null) return `<span style="color:var(--ink-faint);">n/a</span>`;
        const v = g*100;
        const cls = v>=15?'var(--green)':(v<=-10?'var(--red)':'var(--ink-soft)');
        return `<span style="color:${cls};font-weight:600;font-family:var(--font-mono);">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
    }
    function ctxLabel(){
        const parts=[];
        if(state.subRegion !== 'All') parts.push(state.subRegion);
        if(state.mbu !== 'All') parts.push(state.mbu);
        if(state.fid !== 'All') parts.push('FID '+state.fid);
        return parts.length ? parts.join(' · ') : 'North';
    }
    function filteredRawForScope(){
        // filter current-month raw by the selected hierarchy
        let rows = (DATA && DATA.rawData) || [];
        if(state.subRegion !== 'All') rows = rows.filter(r => r.subRegion === state.subRegion);
        if(state.mbu !== 'All') rows = rows.filter(r => r.mbu === state.mbu);
        if(state.fid !== 'All') rows = rows.filter(r => r.fid === state.fid);
        return rows;
    }
    function bundleNameDual(bundle, validity) {
        return `<div class="bundle-name-dual" style="flex:1;min-width:0;">
          <span class="bn-light">${validity ? esc(validity) + ' bundle' : 'Bundle'}</span>
          <span class="bn-bold">${esc(bundle)}</span>
        </div>`;
    }
    function growthCell(g) {
        if(g === null) return `<span class="intel-growth-cell na">n/a</span>`;
        const v = g*100;
        const cls = v>=15?'pos':(v<=-10?'neg':'neu');
        return `<span class="intel-growth-cell ${cls}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
    }
    function momBadge(status) {
        const cls = ({RISING:'rising', STABLE:'stable', DECLINING:'declining', EMERGING:'emerging', DORMANT:'dormant'})[status] || 'stable';
        return `<span class="intel-mom-badge ${cls}">${esc(status)}</span>`;
    }
    /* ===== INTELLIGENCE PAGE V6 ===== */
    /* Keep every Intelligence-only failure inside this view. A malformed cache,
       missing optional metric, or calculation issue must never result in a
       blank page or take down the rest of the dashboard. */
    function renderIntelligencePage() {
        const el = document.getElementById('view-intelligence');
        if (!el) return;
        try {
            renderIntelligencePageCore();
        } catch (e) {
            console.error('Intelligence render error:', e);
            el.innerHTML = '<div style="margin:24px;padding:22px;border:1px solid #F3C3CA;border-radius:10px;background:#fff7f8;color:#8d1021;font-family:Arial,sans-serif"><h3 style="margin-top:0">Intelligence page needs refreshed data</h3><p>The rest of the dashboard remains available. Clear the dashboard cache and upload all four Excel files again.</p><details><summary>Technical details</summary><pre style="white-space:pre-wrap;font-size:11px">' + esc(e && (e.stack || e.message) || String(e)) + '</pre></details></div>';
        }
    }
    function renderIntelligencePageCore() {
        const el = document.getElementById('view-intelligence');
        if(!el) return;
        const intel = DATA.intel || {};
        const ctx = ctxLabel();
        const scopeBaseRaw = filteredRawForScope();
        const bundleTypes = [...new Set(scopeBaseRaw.map(r=>classifyBundleType(r.bundle)).filter(Boolean))].sort();
        const selectedBundleType = state.intBundleType || 'All';
        const bundleTypeMatches = r => selectedBundleType === 'All' || classifyBundleType(r.bundle) === selectedBundleType;
        const scopedRaw = scopeBaseRaw.filter(bundleTypeMatches);
        const curDays = DATA.dateRange ? diffDaysFromRange(DATA.dateRange.min, DATA.dateRange.max) : 1;

        // ── Utilities ──────────────────────────────────────────────────────────
        function diffDaysFromRange(a, b) {
            const d1=new Date(a), d2=new Date(b);
            if(isNaN(d1)||isNaN(d2)) return 1;
            return Math.max(1, Math.round((d2-d1)/86400000)+1);
        }
        function fmtLift(v) {
            if(v===null||v===undefined) return '<span style="color:var(--ink-faint)">—</span>';
            if(!isFinite(v)) return '<span style="color:var(--amber)">+∞ (new)</span>';
            const pv=(v*100).toFixed(1);
            const c=v>=0.1?'var(--green)':v<=-0.1?'var(--red)':'var(--ink-soft)';
            return `<span style="color:${c};font-weight:700;font-family:var(--font-mono)">${v>=0?'+':''}${pv}%</span>`;
        }
        function fmtRate(v) { return v!==null?`<span style="font-family:var(--font-mono)">${v.toFixed(2)}/day</span>`:'<span style="color:var(--ink-faint)">—</span>'; }
        function fmtPctV(v) { return v!==null?`${(v*100).toFixed(1)}%`:'—'; }
        function fixed(v, digits) {
            const n=Number(v);
            return Number.isFinite(n) ? n.toFixed(digits) : '—';
        }
        function scoreBar(score) {
            const colors=['#D6112C','#B4700A','#1F8A55'];
            const c=score>=65?colors[2]:score>=35?colors[1]:colors[0];
            return `<div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:${score}%;height:100%;background:${c};border-radius:3px"></div></div><span style="font-family:var(--font-mono);font-size:12px;font-weight:700;min-width:24px;text-align:right">${score}</span></div>`;
        }
        function statusBadge(s) {
            const cls={RISING:'strong',STABLE:'normal',DECLINING:'high',EMERGING:'watch',DORMANT:'nodata'}[s]||'normal';
            return `<span class="pill ${cls}">${s}</span>`;
        }
        function confBadge(c) {
            const cls={High:'strong','Insufficient History':'nodata',Medium:'watch',Low:'high'}[c]||'normal';
            return `<span class="pill ${cls}" style="font-size:10px">${c}</span>`;
        }
        function dirBadge(d) {
            const cls={Growing:'strong',Declining:'high',Flat:'normal',Unknown:'nodata'}[d]||'normal';
            const arrow={Growing:'↑',Declining:'↓',Flat:'→'}[d]||'?';
            return `<span class="pill ${cls}">${arrow} ${d}</span>`;
        }
        function pctFmt(v) { return v!==null&&v!==undefined?`${(v*100).toFixed(1)}%`:'—'; }
        function moneyFmt(v) { return fmtMoney(v); }
        function sectionLabel(id, text, sub) {
            return `<div class="section-label" id="${id}"><span class="sig"><i></i><i></i><i></i></span>${esc(text)}${sub?`<span class="sub"> — ${esc(sub)}</span>`:''}</div>`;
        }

        // ── Scoped historical periods ──────────────────────────────────────────
        function scopedPeriodStats(ds) {
            if(!ds||!ds.rawData) return [];
            let rows=ds.rawData;
            if(state.subRegion!=='All') rows=rows.filter(r=>r.subRegion===state.subRegion);
            if(state.mbu!=='All')       rows=rows.filter(r=>r.mbu===state.mbu);
            if(state.fid!=='All')       rows=rows.filter(r=>r.fid===state.fid);
            return bundleStatsFromRaw(rows.filter(bundleTypeMatches));
        }

        // ── Re-run momentum for current scope ────────────────────────────────
        const scopeHist = (DATA.historical||[]).slice(-3).reverse().map(h=>({
            stats: scopedPeriodStats(h),
            days:  h.dateRange ? diffDaysFromRange(h.dateRange.min, h.dateRange.max) : 30,
            label: h.reportingPeriod || '?'
        }));
        const scopeCurStats = bundleStatsFromRaw(scopedRaw);
        const scopeCurTotal = scopeCurStats.reduce((a,b)=>a+b.events,0);
        const scopeCurRecharge = scopeCurStats.reduce((a,b)=>a+b.recharge,0);

        // data-driven activity floor scoped to current selection
        const scopeEventVals = scopeCurStats.map(b=>b.events).filter(v=>v>0).sort((a,b)=>a-b);
        let scopeFloor = Math.max(5, scopeEventVals[Math.max(0,Math.floor(scopeEventVals.length*0.10)-1)]||5);

        // historical weights
        const SCOPE_WEIGHTS=[0.5,0.3,0.2];
        function scopeWeighted(n) {
            const sl=SCOPE_WEIGHTS.slice(0,Math.min(n,3));
            const tot=sl.reduce((a,b)=>a+b,0);
            return sl.map(w=>w/tot);
        }

        function computeScopeMomentum(bundleName) {
            const cb = scopeCurStats.find(x=>x.bundle===bundleName)||{events:0,recharge:0,commission:0};
            const curRate = cb.events/Math.max(curDays,1);
            const weights = scopeWeighted(scopeHist.length);
            let totalW=0, wRate=0, monthsUsed=0;
            scopeHist.forEach((hp,i)=>{
                const b=hp.stats.find(x=>x.bundle===bundleName);
                if(b!==undefined) {
                    const r=b?b.events/Math.max(hp.days,1):0;
                    wRate += r*(weights[i]||0);
                    totalW += (weights[i]||0);
                    monthsUsed++;
                }
            });
            const baseline = totalW>0?wRate/totalW:null;
            let lift=null, momentumWarning=null;
            if(baseline!==null) {
                if(baseline>0) lift=(curRate-baseline)/baseline;
                else if(baseline===0&&curRate>0) momentumWarning='ZERO_BASELINE';
                else lift=0;
            } else {
                if(curRate>0) momentumWarning='NO_HISTORY';
            }
            // slope
            const pts=[];
            scopeHist.slice().reverse().forEach((hp,i)=>{
                const b=hp.stats.find(x=>x.bundle===bundleName);
                pts.push({x:i,y:b?b.events/Math.max(hp.days,1):0});
            });
            pts.push({x:pts.length,y:curRate});
            const n=pts.length;
            const xm=(n-1)/2,ym=pts.reduce((s,p)=>s+p.y,0)/n;
            let num_=0,den=0;
            pts.forEach(p=>{num_+=(p.x-xm)*(p.y-ym);den+=(p.x-xm)**2;});
            const slope=den===0?0:num_/den;
            // consistency
            let nonDecl=0,total=0;
            for(let i=1;i<pts.length;i++){total++;if(pts[i].y>=pts[i-1].y)nonDecl++;}
            const consistency=total>0?nonDecl/total:null;
            // volatility
            const histVals=scopeHist.map(hp=>{const b=hp.stats.find(x=>x.bundle===bundleName);return b&&b.events>0?b.events/Math.max(hp.days,1):null;}).filter(v=>v!==null);
            let vol=0;
            if(histVals.length>=2){const m=histVals.reduce((a,b)=>a+b,0)/histVals.length;if(m>0)vol=Math.sqrt(histVals.reduce((a,v)=>a+(v-m)**2,0)/histVals.length)/m;}
            // confidence
            let confidence;
            if(monthsUsed===0) confidence='Insufficient History';
            else if(monthsUsed>=3&&vol<0.5) confidence='High';
            else if(monthsUsed>=2) confidence='Medium';
            else confidence='Low';
            // status
            let status='STABLE';
            if(curRate===0&&scopeHist.some(hp=>{const b=hp.stats.find(x=>x.bundle===bundleName);return b&&b.events>0;})) status='DORMANT';
            else if(momentumWarning==='ZERO_BASELINE'||momentumWarning==='NO_HISTORY') { if(curRate>0)status='EMERGING'; }
            else if(lift!==null) {
                if(lift>=0.10&&slope>0&&consistency!==null&&consistency>=0.50&&cb.events>=scopeFloor&&monthsUsed>=1) status='RISING';
                else if(lift<=-0.10&&slope<0&&cb.events>=scopeFloor) status='DECLINING';
            }
            if(monthsUsed===1&&vol>0.5&&(status==='RISING'||status==='DECLINING'))status='STABLE';
            const activationShare=scopeCurTotal>0?cb.events/scopeCurTotal:null;
            const rechargeShare=scopeCurRecharge>0?cb.recharge/scopeCurRecharge:null;
            const rechargePerEvent=cb.events>0?cb.recharge/cb.events:null;
            return {bundle:bundleName,curRate,baseline,lift,slope,consistency,vol,confidence,status,momentumWarning,monthsUsed,
                events:cb.events,recharge:cb.recharge,commission:cb.commission,
                activationShare,rechargeShare,rechargePerEvent};
        }

        const allBundleNames=[...new Set([
            ...scopeCurStats.map(b=>b.bundle),
            ...scopeHist.flatMap(hp=>hp.stats.map(b=>b.bundle))
        ])];
        let scopeMom = allBundleNames.map(b=>computeScopeMomentum(b)).sort((a,b)=>b.events-a.events);

        // Rebuild the complete decision engine for this exact hierarchy and
        // bundle-type selection. This replaces the former global-NBA filtering.
        const decisionKey = [state.subRegion,state.mbu,state.fid,selectedBundleType].join('|');
        let scopedDecision = scopedDecisionCache.get(decisionKey);
        if(!scopedDecision) {
            const filterRows = rows => (rows||[]).filter(r =>
                (state.subRegion==='All' || r.subRegion===state.subRegion) &&
                (state.mbu==='All' || r.mbu===state.mbu) &&
                (state.fid==='All' || r.fid===state.fid) &&
                bundleTypeMatches(r)
            );
            // Keep the selected FID's local peers available for its opportunity
            // benchmark, while RAW momentum remains restricted to the FID.
            const scopedFids = fidsInScope();
            const scopedMbus = mbusInScope().filter(m=>state.mbu==='All'||m.mbu===state.mbu);
            const scopedCurrent = { ...DATA, rawData: scopedRaw, fids:scopedFids, mbus:scopedMbus };
            const scopedHistoricalData = (DATA.historical||[]).map(h=>({ ...h, rawData:filterRows(h.rawData) }));
            scopedDecision = JI.buildIntelligence ? JI.buildIntelligence(scopedCurrent, scopedHistoricalData) : {};
            scopedDecision.propensity = scopedDecision.bundlePriority || [];
            scopedDecision.peerSignals = {
                comparisonLevel: state.fid!=='All' ? 'FID peers in the selected MBU / sub-region' : (state.mbu!=='All' ? 'FID peers in the selected MBU' : (state.subRegion!=='All' ? 'MBU/FID peers in the selected sub-region' : 'Sub-region peers across North')),
                peerFidCount: scopedFids.length
            };
            scopedDecision.metadata = { scope:ctx, bundleType:selectedBundleType, cacheKey:decisionKey, historicalPeriods:scopedHistoricalData.length };
            scopedDecisionCache.set(decisionKey, scopedDecision);
        }
        // The scoped engine is the single source of truth for displayed
        // momentum as well as priority, opportunity, and Next Best Action.
        if(Array.isArray(scopedDecision.bundleMomentum)) {
            scopeMom = scopedDecision.bundleMomentum.map(m=>({ ...m, curRate:m.eventsPerDay, baseline:m.baselineRate }));
        }
        scopeFloor = scopedDecision.activityFloor || scopeFloor;
        const scopedFidOpportunities = (scopedDecision.fidOpportunities||[])
            .filter(o=>state.fid==='All'||o.fid===state.fid);

        // ── SECTION A: Control Summary ─────────────────────────────────────────
        const rising=scopeMom.filter(b=>b.status==='RISING').length;
        const declining=scopeMom.filter(b=>b.status==='DECLINING').length;
        const emerging=scopeMom.filter(b=>b.status==='EMERGING').length;
        const dormant=scopeMom.filter(b=>b.status==='DORMANT').length;
        const histMonths=(DATA.historical||[]).length;

        // ── SECTION E: Validity categories scoped ────────────────────────────
        const validityCats={};
        scopeMom.forEach(m=>{
            const v=classifyValidity(m.bundle)||'Unknown';
            if(!validityCats[v]) validityCats[v]={validity:v,events:0,recharge:0,bundleCount:0,bundles:[]};
            validityCats[v].events+=m.events;
            validityCats[v].recharge+=m.recharge;
            validityCats[v].bundleCount++;
            validityCats[v].bundles.push(m.bundle);
        });
        const vtCats=Object.values(validityCats).sort((a,b)=>b.events-a.events);

        // Build validity trend using scoped data, matching existing intel.validityTrend direction
        const vtRows=(scopedDecision.validityTrend||[]);

        // ── SECTION C: Priority scores scoped ────────────────────────────────
        const prioritySource = scopedDecision.bundlePriority || [];
        const scopePriority = (Array.isArray(prioritySource) ? prioritySource : [])
            .filter(p=>scopeMom.some(m=>m.bundle===p.bundle));

        // ── SECTION F: Regional comparison ────────────────────────────────────
        const srBundles={};
        (scopedDecision.regionMomentum||[]).forEach(region=>{
            srBundles[region.subRegion]={};
            (region.bundles||[]).forEach(bundle=>{
                srBundles[region.subRegion][bundle.bundle]={ events:bundle.events||0, recharge:bundle.recharge||0 };
            });
        });
        const srNames=Object.keys(srBundles);

        // ── SECTION G: fresh NBA for this exact scope ────────────────────────
        const actionWeight={ OPPORTUNITY_TERRITORY:100, DECLINING_HIGHVALUE:90, MULTI_DECLINING:85, RISING_ACCELERATION:80, REGIONAL_REPLICATION:70, NO_ACTION:0 };
        const actionKeys = new Set();
        const scopeActions=(scopedDecision.nextBestActions||[]).filter(a=>
            state.fid==='All' || a.type!=='OPPORTUNITY_TERRITORY' || String(a.entity||'').includes('FID '+state.fid)
        ).map(a=>{
            const bundlePriority=(scopedDecision.bundlePriority||[]).find(p=>p.bundle===a.bundle);
            return { ...a, actionPriority:(actionWeight[a.type]||50)+(a.opportunityScore||0)+(bundlePriority?bundlePriority.score/4:0)+Math.max(0,(a.rechargeShare||0)*100) };
        }).filter(a=>{
            const key=[a.type||'',a.bundle||'',a.entity||''].join('|');
            if(actionKeys.has(key)) return false;
            actionKeys.add(key);
            return true;
        }).sort((a,b)=>b.actionPriority-a.actionPriority);

        // ══════════════════════════════════════════════════════════════════════
        // BUILD HTML
        // ══════════════════════════════════════════════════════════════════════
        try { el.innerHTML = `

<!-- ── SECTION A: CONTROL SUMMARY ─────────────────────────────────────────── -->
${sectionLabel('intA','Intelligence Control Summary','')}
<div class="intel-ctrl-summary">
  <div class="intel-ctrl-card green"><div class="cc-label">Current Period</div><div class="cc-value sm">${DATA.currentMonthLabel||DATA.reportingPeriod||'?'}</div></div>
  <div class="intel-ctrl-card"><div class="cc-label">Historical Periods</div><div class="cc-value">${histMonths}</div></div>
  <div class="intel-ctrl-card"><div class="cc-label">Active Bundles</div><div class="cc-value">${scopeMom.filter(b=>b.events>0).length}</div><div class="cc-sub">${esc(selectedBundleType)}</div></div>
  <div class="intel-ctrl-card green"><div class="cc-label">Rising Bundles</div><div class="cc-value">${rising}</div><div class="cc-sub">in scope</div></div>
  <div class="intel-ctrl-card accent"><div class="cc-label">Declining Bundles</div><div class="cc-value">${declining}</div><div class="cc-sub">in scope</div></div>
  <div class="intel-ctrl-card"><div class="cc-label">Emerging</div><div class="cc-value">${emerging}</div><div class="cc-sub">new activity</div></div>
  <div class="intel-ctrl-card"><div class="cc-label">Dormant</div><div class="cc-value">${dormant}</div><div class="cc-sub">previously active</div></div>
</div>

<div style="display:flex;align-items:end;gap:10px;margin:0 0 16px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px">
  <div class="filter-field" style="min-width:210px"><label>Bundle type</label><select id="int-bundle-type"><option value="All">All bundle types</option>${bundleTypes.map(t=>`<option value="${esc(t)}" ${t===selectedBundleType?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
</div>

<!-- ── FILE SUMMARY STRIP ─────────────────────────────────────────────────── -->
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
  ${(DATA.sources||[]).map((ds,i)=>{
    const isCur=i===DATA.sources.length-1;
    return `<div style="flex:1;min-width:160px;background:var(--surface);border:1px solid ${isCur?'var(--green)':'var(--border)'};border-radius:8px;padding:10px 14px">
      <div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:${isCur?'var(--green)':'var(--ink-faint)'};margin-bottom:2px">${isCur?'CURRENT':'HISTORICAL '+(DATA.sources.length-1-i)}</div>
      <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(ds.fileName)}">${esc(ds.fileName||'?')}</div>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)">${esc(ds.period||ds.reportingPeriod||'?')}</div>
    </div>`;
  }).join('')}
</div>

<!-- ── SECTION B: BUNDLE MOMENTUM ─────────────────────────────────────────── -->
${sectionLabel('intB','Bundle Momentum',`${scopeMom.filter(b=>b.events>0).length} active bundles · ${esc(selectedBundleType)}`)}
<div style="overflow-x:auto;margin-bottom:20px">

  <th>Momentum Lift</th><th>Slope</th><th>Consistency</th><th>Volatility</th>
  <th>Conf.</th><th>Months</th><th>Status</th><th>Recharge</th><th>Rch/Evt</th><th>Act Share</th><th>Verdict</th>
</tr></thead>
<tbody>
${scopeMom.filter(b=>b.events>0||b.status==='DORMANT').map(m=>`
<tr>
  <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(m.bundle)}">${esc(m.bundle)}</td>
  <td><span style="font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px">${esc(classifyValidity(m.bundle)||'Other')}</span></td>
  <td style="font-family:var(--font-mono)">${fmtInt(m.events)}</td>
  <td style="font-family:var(--font-mono)">${fixed(m.curRate!==undefined?m.curRate:m.eventsPerDay,2)}</td>
  <td style="font-family:var(--font-mono)">${m.baseline!==null&&m.baseline!==undefined?fixed(m.baseline,2):'<span style="color:var(--ink-faint);font-size:11px">No History</span>'}</td>
  <td>${fmtLift(m.lift)}${m.momentumWarning?`<br><span style="font-size:10px;color:var(--amber)">${esc(m.momentumWarning)}</span>`:''}</td>
  <td style="font-family:var(--font-mono);color:${m.slope>0.01?'var(--green)':m.slope<-0.01?'var(--red)':'var(--ink-soft)'}">${fixed(m.slope,3)}</td>
  <td style="font-family:var(--font-mono)">${m.consistency!==null?pctFmt(m.consistency):'—'}</td>
  <td style="font-family:var(--font-mono);color:${(m.vol!==undefined?m.vol:m.volatility)>0.5?'var(--amber)':'var(--ink-soft)'}">${fixed(m.vol!==undefined?m.vol:m.volatility,2)}</td>
  <td>${confBadge(m.confidence)}</td>
  <td style="font-family:var(--font-mono);text-align:center">${m.monthsUsed}</td>
  <td>${statusBadge(m.status)}</td>
  <td style="font-family:var(--font-mono)">${moneyFmt(m.recharge)}</td>
  <td style="font-family:var(--font-mono)">${m.rechargePerEvent!==null&&m.rechargePerEvent!==undefined?fixed(m.rechargePerEvent,1):'—'}</td>
  <td style="font-family:var(--font-mono)">${m.activationShare!==null?pctFmt(m.activationShare):'—'}</td>
  <td style="font-size:11px;color:var(--ink-soft);white-space:nowrap"></td>
</tr>`).join('')}
</tbody></table></div>

<!-- ── SECTION C: BUNDLE PRIORITY SCORE ───────────────────────────────────── -->
${sectionLabel('intC','Bundle Priority Score (0–100)','')}
${scopePriority.slice(0,15).map(p=>{
    const colors=['#D6112C','#B4700A','#1F8A55'];
    const barC=p.score>=65?colors[2]:p.score>=35?colors[1]:colors[0];
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
  <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
    <div style="flex:0 0 auto;text-align:center;min-width:60px">
      <div style="font-family:var(--font-mono);font-size:24px;font-weight:700;color:${barC}">${p.score}</div>
      <div style="font-size:9px;color:var(--ink-faint);text-transform:uppercase">/100</div>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.bundle)}">${esc(p.bundle)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
        ${statusBadge(p.status)}
        <span class="pill ${p.band.includes('High')?'strong':p.band.includes('Strong')?'normal':p.band.includes('Monitor')?'watch':'nodata'}" style="font-size:10px">${esc(p.band)}</span>
        ${confBadge(p.confidence)}

        const segs = [{ l:'APC', v:m.apcShare, c:'#1F3A5F' }, { l:'OTAR', v:m.otarShare, c:'#D6112C' }, { l:'Missed call', v:m.mwShare, c:'#B4700A' }, { l:'Self-care', v:m.scShare, c:'#1F8A55' }];
        return `<div class="mix-bar">${segs.map(s=>`<div style="width:${(s.v||0)*100}%;background:${s.c};"></div>`).join('')}</div>
          <div class="mix-legend">${segs.map(s=>`<span><i style="background:${s.c};"></i>${s.l} ${fmtPct(s.v)}</span>`).join('')}</div>`;
    }

    /* ===== FID PAGE ===== */
    function renderFidPage() {
        const el = document.getElementById('view-fid');
        const scope = fidsInScope().slice().sort((a,b) => (b.activePct||0) - (a.activePct||0));
        const single = state.fid !== 'All' ? fids.find(f => f.fid === state.fid) : null;
        const k = single || aggregate(scope);
        el.innerHTML = `
        <div class="section-label"><span class="sig"><i></i><i></i><i></i></span>FID summary — ${esc(state.fid!=='All'?('FID '+state.fid):(state.mbu!=='All'?state.mbu:(state.subRegion!=='All'?state.subRegion:'North')))}</div>
        <div class="kpi-row">
          ${kpiCard('Recharge', fmtMoney(k.recharge), '')}
          ${kpiCard('Revenue', fmtMoney(k.revenue), '')}
          ${kpiCard('Active Retailers', fmtInt(k.active), fmtPct(k.activePct))}
          ${kpiCard('EVC Retailer Base', fmtInt(k.evc), '')}
          ${kpiCard('Inactive Retailers', fmtInt(k.inactive), fmtPct(k.inactivePct), true)}
          ${kpiCard('Commission', fmtMoney(k.commission), '')}
          ${kpiCard('90-Day Subscribers', fmtInt(k.subs90d), '')}
          ${single?kpiCard('TSS', single.tss||'—', single.location||''):''}
        </div>
        <div class="card" style="margin-top:12px;">
          <h3>FID ranking — ${scope.length} FIDs in scope</h3>
          <div class="tbl-scroll"><table class="data-tbl" id="fid-table"></table></div>
        </div>`;
        renderSortableTable('fid-table', scope, [
            { k:'fid', l:'FID', type:'text' },
            { k:'mbu', l:'MBU', type:'text' },
            { k:'tss', l:'TSS', type:'text' },
            { k:'subRegion', l:'Sub-region', type:'text' },
            { k:'recharge', l:'Recharge', type:'money' },
            { k:'revenue', l:'Revenue', type:'money' },
            { k:'activePct', l:'Active %', type:'pct' },
            { k:'inactivePct', l:'Inactive %', type:'pct' },
            { k:'events', l:'Events', type:'int' },
            { k:'commission', l:'Commission', type:'money' }
        ], row => { state.fid = row.fid; state.mbu = row.mbu; state.subRegion = row.subRegion; renderTopbar(); renderView(); });
    }

    /* ===== BUNDLES PAGE ===== */
    function renderBundlesPage() {
        const el = document.getElementById('view-bundles');
        const headerLabel = state.fid !== 'All' ? ('FID '+state.fid) : (state.mbu !== 'All' ? state.mbu : 'FID-level');
        el.innerHTML = `
        <div class="section-label"><span class="sig"><i></i><i></i><i></i></span>Which bundles are driving the business — North region, ${esc(DATA.dateRange.min)} to ${esc(DATA.dateRange.max)}</div>
        <div class="grid-2">
          <div class="card"><h3>Top bundles by activation events</h3><div id="rank-events"></div></div>
          <div class="card"><h3>Top bundles by BU recharge</h3><div id="rank-recharge"></div></div>
        </div>
        `;
        document.getElementById('rank-events').innerHTML = bundleRankHtml(DATA.topBundlesEvents.map(b => ({ name: b.bundle, events: b.events, contrib: null })), 'events', '#1F3A5F').replace(/<div class="bundle-val" style="width:44px[^>]*>—<\/div>/g,'');
        document.getElementById('rank-recharge').innerHTML = bundleRankHtml(DATA.topBundlesRecharge.map(b => ({ name: b.bundle, rech: b.recharge, contrib: null })), 'rech', '#D6112C').replace(/<div class="bundle-val" style="width:44px[^>]*>—<\/div>/g,'');

    }

    /* ===== OPPORTUNITY FINDER ===== */
    function renderOpportunities() {
        const el = document.getElementById('view-opportunities');
        el.innerHTML = `
        <div class="section-label"><span class="sig"><i></i><i></i><i></i></span>Opportunity Finder</div>
        <div class="op-controls">
          <div class="op-toggle"><button data-grain="fid" class="${state.opGrain==='fid'?'active':''}">By FID</button><button data-grain="mbu" class="${state.opGrain==='mbu'?'active':''}">By MBU</button></div>
          <div class="op-slider-block"><div class="row"><span>High-priority inactive-% threshold</span><span id="op-thresh-val" style="font-family:var(--font-mono);font-weight:700;color:var(--red);">${(state.opThreshold*100).toFixed(0)}%</span></div>
            <input type="range" id="op-slider" min="0.10" max="0.35" step="0.01" value="${state.opThreshold}"></div>
          <div class="op-count" id="op-count"></div>
        </div>
        <div class="card">
          <div class="tbl-scroll"><table class="data-tbl" id="op-table"></table></div>
        </div>`;
        document.querySelectorAll('.op-toggle button').forEach(b => b.addEventListener('click', () => { state.opGrain = b.dataset.grain; renderOpportunities(); }));
        document.getElementById('op-slider').addEventListener('input', e => { state.opThreshold = +e.target.value; renderOpportunities(); });
        drawOpTable();
    }

    function drawOpTable() {
        const rows = state.opGrain === 'fid' ? fidsInScope() : mbusInScope();
        const flagged = rows.map(r => ({ row: r, ...opportunityFlag(r.activePct, r.inactivePct) }));
        const counts = { high:0, watch:0, strong:0 };
        flagged.forEach(f => { if(counts[f.flag] !== undefined) counts[f.flag]++; });
        document.getElementById('op-count').innerHTML = `
        <div class="oc high"><div class="n">${counts.high}</div><div class="l">High</div></div>
        <div class="oc watch"><div class="n">${counts.watch}</div><div class="l">Watch</div></div>
        <div class="oc strong"><div class="n">${counts.strong}</div><div class="l">Strong</div></div>`;
        const order = { high:0, watch:1, normal:2, strong:3, nodata:4 };
        flagged.sort((a,b) => order[a.flag] - order[b.flag] || (b.row.inactivePct||0) - (a.row.inactivePct||0));
        const idField = state.opGrain === 'fid' ? 'fid' : 'mbu';
        document.getElementById('op-table').innerHTML = `
        <thead><tr><th>${idField==='fid'?'FID':'MBU'}</th>${idField==='fid'?'<th>MBU</th>':''}<th>Sub-region</th><th class="num">Active %</th><th class="num">Inactive %</th><th>Status</th><th>Why</th></tr></thead>
        <tbody>${flagged.map(f=>`<tr>
          <td>${esc(f.row[idField])}</td>${idField==='fid'?`<td>${esc(f.row.mbu)}</td>`:''}<td>${esc(f.row.subRegion)}</td>
          <td class="num">${fmtPct(f.row.activePct)}</td><td class="num">${fmtPct(f.row.inactivePct)}</td>
          <td><span class="pill ${f.flag}">${({high:'High priority',watch:'Watch',strong:'Strong',normal:'Normal',nodata:'No data'})[f.flag]}</span></td>
          <td style="white-space:normal;max-width:340px;font-size:11.5px;color:var(--ink-soft);">${f.reason}</td></tr>`).join('')}</tbody>`;
    }

    /* ===== DATA QUALITY ===== */
    function renderDataQuality() {
        const el = document.getElementById('view-dataquality');
        const zeroEvcFids = fids.filter(f => f.evc === 0);
        el.innerHTML = `
        <div class="section-label"><span class="sig"><i></i><i></i><i></i></span>Checks run against ${esc(DATA.fileName||'the loaded workbook')}</div>
        <div class="grid-2">
          <div class="card">${DATA.dq.map(d=>`<div class="dq-issue ${d.level==='ok'?'ok':''}">${esc(d.text)}</div>`).join('')}</div>
          <div class="card">
            <h3>FIDs flagged for zero retailer base</h3>
            <div class="tbl-scroll"><table class="data-tbl"><thead><tr><th>FID</th><th>MBU</th><th>Sub-region</th><th class="num">Events recorded</th></tr></thead>
            <tbody>${zeroEvcFids.map(f=>`<tr><td>${esc(f.fid)}</td><td>${esc(f.mbu)}</td><td>${esc(f.subRegion)}</td><td class="num">${fmtInt(f.events)}</td></tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--ink-faint);">None found</td></tr>`}</tbody></table></div>
          </div>
        </div>
        <div class="section-label"><span class="sig"><i></i><i></i><i></i></span>Known limitations</div>
        <div class="two-col-note">
          <div class="card"><h3>Data window</h3><p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;">Raw transaction data spans ${esc(DATA.dateRange.min)} to ${esc(DATA.dateRange.max)} (${DATA.rawRowCount.toLocaleString()} rows). Period-over-period growth beyond that window can't be derived from this file — the "YTD Growth" figures shown elsewhere are pre-calculated values imported from the workbook, not derived here.</p></div>
          <div class="card"><h3>Commission & TSS gaps</h3><p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;">If commission reads ₨0 across the board, that's a genuine gap in the source feed from Jazz's finance system, not a calculation error in this dashboard. TSS/DOS values are only available where the 'FID' sheet has a matching record.</p></div>
        </div>`;
    }

    /* ===== SORTABLE TABLE HELPER ===== */
    function renderSortableTable(id, rows, cols, onRowClick) {
        let sortKey = cols.find(c => c.type !== 'text')?.k || cols[0].k, sortDir = -1;
        function fmt(v, type) {
            if(type === 'pct') return fmtPct(v);
            if(type === 'money') return fmtMoney(v);
            if(type === 'int') return fmtInt(v);
            return v === null || v === undefined ? '—' : esc(v);
        }
        function draw() {
            const sorted = [...rows].sort((a,b) => {
                const av = a[sortKey], bv = b[sortKey];
                if(typeof av === 'string') return sortDir * String(av).localeCompare(String(bv));
                return sortDir * (((av===null?-Infinity:av)) - ((bv===null?-Infinity:bv)));
            });
            const table = document.getElementById(id);
            if(!table) return;
            table.innerHTML = `<thead><tr>${cols.map(c=>`<th class="${c.type!=='text'?'num':''}" data-k="${c.k}">${c.l}${sortKey===c.k?(sortDir===1?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
            <tbody>${sorted.map(r=>`<tr>${cols.map(c=>`<td class="${c.type!=='text'?'num':''}">${fmt(r[c.k],c.type)}</td>`).join('')}</tr>`).join('')}</tbody>`;
            table.querySelectorAll('th').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; if(sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; } draw(); }));
            if(onRowClick) {
                table.querySelectorAll('tbody tr').forEach((tr,i) => { tr.addEventListener('click', () => onRowClick(sorted[i])); tr.style.cursor = 'pointer'; });
            }
        }
        draw();
    }

    root();
    renderView();
};
})();
</script>
</body>
</html>
